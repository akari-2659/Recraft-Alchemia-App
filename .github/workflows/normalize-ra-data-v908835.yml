name: Normalize RA data v90.8.835

on:
  push:
    paths:
      - 'scripts/normalize_ra_data_v908835.py'
      - '.github/workflows/normalize-ra-data-v908835.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize data
        run: python scripts/normalize_ra_data_v908835.py
      - name: Commit normalized data
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recraft_alchemia_initial_data.json data/public/recraft_alchemia_master.json data/public/recraft_alchemia_facility_master.json data/public/recraft_alchemia_character_master.json data/public/manifest.json gm/modules/manager/progress_manager_main.js gm/modules/manager/database_admin_main.js
          git commit -m "Normalize RA master data to v90.8.835 [skip ci]"
          git push
