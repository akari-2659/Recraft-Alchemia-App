name: RA one-shot data patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ra-one-shot-data-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch RA data and versions
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib

          ROOT = pathlib.Path(".")
          RA_VERSION = "90.8.834"
          RA_VERSION_V = "v90.8.834"
          APP_VERSION = "1.0.123"
          NOW = "2026-10-05T12:03:00+09:00"

          full_master_paths = [
              "data/public/recraft_alchemia_master.json",
              "data/recraft_alchemia_initial_data.json",
              "gm/modules/manager/data/public/recraft_alchemia_master.json",
              "gm/modules/manager/data/recraft_alchemia_initial_data.json",
          ]
          facility_paths = [
              "data/public/recraft_alchemia_facility_master.json",
              "gm/modules/manager/data/public/recraft_alchemia_facility_master.json",
          ]
          character_paths = [
              "data/public/recraft_alchemia_character_master.json",
              "gm/modules/manager/data/public/recraft_alchemia_character_master.json",
          ]

          def load(path):
              return json.loads((ROOT/path).read_text(encoding="utf-8"))

          def write(path, obj):
              (ROOT/path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def patch_version(obj):
              obj["version"] = RA_VERSION
              if "updatedAt" in obj:
                  obj["updatedAt"] = NOW
              if "generatedAt" in obj:
                  obj["generatedAt"] = NOW

          def patch_glide(obj):
              data = obj.get("data", obj)
              monsters = data.get("monsters", [])
              monster = next((m for m in monsters if m.get("id") == "mon_glide_scale"), None)
              if monster is None:
                  raise RuntimeError("mon_glide_scale not found")
              variants = json.loads(monster.get("areaVariants") or "{}")
              variants["灰冠の火山峡谷"] = {
                  "hp": 50,
                  "evasionValue": 14,
                  "resistValue": 13,
                  "defenseValue": 3,
                  "initiative": 15,
                  "offenseSkillDelta": 1,
                  "damageFixedDelta": 2,
              }
              monster["areaVariants"] = json.dumps(variants, ensure_ascii=False, separators=(",", ":"))
              monster["updatedAt"] = NOW

          for p in full_master_paths:
              obj = load(p)
              patch_version(obj)
              patch_glide(obj)
              write(p, obj)

          for p in facility_paths:
              obj = load(p)
              patch_version(obj)
              patch_glide(obj)
              write(p, obj)

          for p in character_paths:
              obj = load(p)
              patch_version(obj)
              write(p, obj)

          def file_meta(path):
              raw=(ROOT/path).read_bytes()
              obj=json.loads(raw.decode("utf-8"))
              data=obj.get("data", obj)
              return {
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
                  "recordCount": sum(len(v) for v in data.values() if isinstance(v, list)),
                  "dataKeys": [k for k,v in data.items() if isinstance(v, list)],
              }

          master_meta=file_meta("data/public/recraft_alchemia_master.json")
          facility_meta=file_meta("data/public/recraft_alchemia_facility_master.json")
          character_meta=file_meta("data/public/recraft_alchemia_character_master.json")

          for p in ["data/public/manifest.json","gm/modules/manager/data/public/manifest.json"]:
              mf=load(p)
              mf["version"]=RA_VERSION
              mf["updatedAt"]=NOW
              mf["files"]["master"].update({k:master_meta[k] for k in ("sha256","bytes","recordCount","dataKeys")})
              mf["files"]["facility"].update({k:facility_meta[k] for k in ("sha256","bytes","recordCount","dataKeys")})
              mf["files"]["character"].update({k:character_meta[k] for k in ("sha256","bytes","recordCount","dataKeys")})
              mf["sha256"]=master_meta["sha256"]
              mf["bytes"]=master_meta["bytes"]
              mf["recordCount"]=master_meta["recordCount"]
              write(p,mf)

          ra_text_files = [
              "gm/index.html",
              "gm/modules/manager/bestiary_manager.html",
              "gm/modules/manager/database_admin.html",
              "gm/modules/manager/help.html",
              "gm/modules/manager/progress_manager.html",
              "gm-player/index.html",
              "gm-player/modules/character/character.html",
              "gm-player/modules/facility/facility.html",
          ]
          for p in ra_text_files:
              path=ROOT/p
              s=path.read_text(encoding="utf-8")
              s=s.replace("90.8.833","90.8.834")
              path.write_text(s,encoding="utf-8")

          # Cache-bust current GM shell and manager data fetches.
          for p in ["gm/app.js","gm/index.html","gm/sw.js","gm/modules/manager/progress_manager.html"]:
              path=ROOT/p
              s=path.read_text(encoding="utf-8").replace("1.0.122","1.0.123")
              path.write_text(s,encoding="utf-8")
          p=ROOT/"gm/modules/manager/bestiary_manager.html"
          p.write_text(p.read_text(encoding="utf-8").replace("?v=1.0.120","?v=1.0.123"),encoding="utf-8")

          # GM Player currently has a mixed 1.0.120/1.0.122 shell. Normalize only active version constants/URLs.
          p=ROOT/"gm-player/app.js"
          p.write_text(p.read_text(encoding="utf-8").replace("const APP_VERSION='1.0.122'","const APP_VERSION='1.0.123'"),encoding="utf-8")
          p=ROOT/"gm-player/index.html"
          p.write_text(p.read_text(encoding="utf-8").replace("1.0.122","1.0.123"),encoding="utf-8")
          p=ROOT/"gm-player/ra_startup_overlay.js"
          p.write_text(p.read_text(encoding="utf-8").replace("const STARTUP_APP_VERSION = '1.0.120'","const STARTUP_APP_VERSION = '1.0.123'"),encoding="utf-8")
          p=ROOT/"gm-player/sw.js"
          p.write_text(p.read_text(encoding="utf-8").replace("const APP_VERSION='1.0.120'","const APP_VERSION='1.0.123'"),encoding="utf-8")
          p=ROOT/"gm-player/modules/facility/facility.html"
          p.write_text(p.read_text(encoding="utf-8").replace("v=1.0.122","v=1.0.123"),encoding="utf-8")

          for p in ["gm/version.json","gm-player/version.json"]:
              obj=load(p)
              obj["app"]="v"+APP_VERSION
              obj["version"]=APP_VERSION
              obj["raVersion"]=RA_VERSION_V
              obj["publishedAt"]=NOW
              obj["releasedAt"]=NOW
              obj["updatedAt"]="2026-10-05"
              write(p,obj)

          # Hard validation before commit.
          for p in full_master_paths + facility_paths:
              obj=load(p); data=obj.get("data",obj)
              m=next(m for m in data["monsters"] if m["id"]=="mon_glide_scale")
              v=json.loads(m["areaVariants"])["灰冠の火山峡谷"]
              assert v == {"hp":50,"evasionValue":14,"resistValue":13,"defenseValue":3,"initiative":15,"offenseSkillDelta":1,"damageFixedDelta":2}
              assert obj["version"]==RA_VERSION
          for p in character_paths:
              assert load(p)["version"]==RA_VERSION
          for p in ["data/public/manifest.json","gm/modules/manager/data/public/manifest.json"]:
              mf=load(p)
              assert mf["version"]==RA_VERSION
              assert mf["files"]["master"]["sha256"]==master_meta["sha256"]
              assert mf["files"]["facility"]["sha256"]==facility_meta["sha256"]
              assert mf["files"]["character"]["sha256"]==character_meta["sha256"]
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data gm gm-player
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Audit reused monster area variants: RA v90.8.834"
          git push origin HEAD:main
