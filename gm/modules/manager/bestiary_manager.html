<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>リクラフト・アルケミア 魔物図鑑管理 v90.8.820</title>
<style>
:root{--bg:#f7f2e8;--paper:#fffaf3;--paper2:#f2e5d1;--ink:#2d241b;--muted:#76695b;--line:#d9c7a8;--accent:#8b5e34;--accent2:#bd8242;--good:#23724b;--bad:#a43d35;--shadow:0 14px 34px rgba(82,52,24,.13)}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",system-ui,sans-serif;background:linear-gradient(180deg,#fff8ea 0%,var(--bg) 44%,#eee0cb 100%);color:var(--ink);min-height:100svh}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.header-inner{width:min(1180px,100%);margin:auto;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,30px);margin:0}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:900;color:var(--muted)}.version{font-size:12px;color:var(--muted);font-weight:800}
main{width:min(1180px,100%);margin:auto;padding:18px;display:grid;gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.notice{margin:0;color:var(--muted);line-height:1.65;font-size:13px}.summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) minmax(180px,280px) auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}input,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:11px;background:#fffdf8;color:var(--ink);padding:10px 11px}button{font:inherit;border:0;border-radius:11px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000 18%));color:#fff;font-weight:850;padding:10px 13px;cursor:pointer}button.secondary{background:var(--paper2);color:var(--ink);border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.48;cursor:not-allowed}
.status{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper2);font-size:13px;color:var(--muted)}.status.ok{color:var(--good)}.status.error{color:var(--bad)}.area-list{display:grid;gap:12px}.area-group{border:1px solid var(--line);border-radius:15px;background:var(--paper);overflow:hidden}.area-group>summary{cursor:pointer;padding:12px 14px;background:var(--paper2);font-weight:900;display:flex;justify-content:space-between;gap:10px;list-style:none}.area-group>summary::-webkit-details-marker{display:none}.area-count{font-size:12px;color:var(--muted);font-weight:800}.monster-list{display:grid;gap:9px;padding:11px}.monster-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.monster-card>summary{cursor:pointer;padding:10px 12px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.monster-card.dirty>summary::after{content:"未保存";font-size:11px;padding:3px 7px;border-radius:999px;background:#fff0cf;color:#8b5c00;border:1px solid #e8c377}.monster-title{display:flex;align-items:center;gap:8px;min-width:0}.named-badge{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;background:#f2e4cf}.monster-body{padding:0 12px 12px;display:grid;gap:13px}.section-title{font-weight:900;margin-bottom:7px}.options{display:flex;flex-wrap:wrap;gap:8px 14px}.option{display:inline-flex;align-items:flex-start;gap:7px;font-weight:800;font-size:13px;line-height:1.45}.option input{width:auto;margin-top:2px}.affinity-grid{display:grid;grid-template-columns:repeat(8,minmax(60px,1fr));gap:6px}.affinity{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fffdf8}.actions{display:grid;gap:7px}.action-card{border:1px solid var(--line);border-radius:10px;background:#fffdf8;overflow:hidden}.action-card>summary{cursor:pointer;padding:8px 10px;font-weight:850;background:color-mix(in srgb,var(--paper2) 70%,#fff 30%)}.action-controls{display:flex;flex-wrap:wrap;gap:10px 16px;padding:10px}.save-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.save-state{font-size:12px;color:var(--muted)}
.bulk-save-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bulk-save-bar .dirty-count{font-size:12px;color:var(--muted);font-weight:800;margin-right:auto}
.bulk-save-progress{display:grid;grid-template-columns:minmax(120px,240px) auto;gap:8px;align-items:center;width:100%;margin-top:4px}.bulk-save-progress[hidden]{display:none}.bulk-save-progress progress{width:100%;height:12px;accent-color:var(--accent)}.bulk-save-progress span{min-width:44px;text-align:right;font-weight:900;font-size:12px}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.affinity-grid{grid-template-columns:repeat(4,1fr)}.header-inner{align-items:flex-start}}
</style></head>
<body class="ra-app"><header><div class="header-inner"><div><div class="eyebrow">BESTIARY MANAGEMENT</div><h1>魔物図鑑管理</h1></div><div class="version">RA v90.8.820</div></div></header>
<main>
<section class="panel"><div class="summary-row"><p class="notice">プレイヤー側の魔物図鑑へ公開する情報を管理します。通常個体・二つ名個体の両方が対象です。効果を公開すると、その行動情報も自動で公開されます。</p><button id="reloadBtn" type="button" class="secondary">再読込</button></div></section>
<section class="panel"><div class="toolbar"><div class="field"><label for="searchInput">検索</label><input id="searchInput" type="search" placeholder="魔物名・エリア名で検索"></div><div class="field"><label for="areaFilter">エリア</label><select id="areaFilter"><option value="">全エリア</option></select></div><div class="field"><label>&nbsp;</label><button id="clearFilterBtn" type="button" class="secondary">絞り込み解除</button></div></div></section>
<section class="panel"><div class="bulk-save-bar"><span id="dirtyCount" class="dirty-count">変更 0体</span><button id="saveDirtyBtn" type="button" disabled>変更した魔物を保存</button><div id="bulkSaveProgressWrap" class="bulk-save-progress" hidden><progress id="bulkSaveProgress" max="100" value="0"></progress><span id="bulkSaveProgressText">0%</span></div></div></section>
<div id="status" class="status">図鑑公開状態を読み込んでいます…</div><div id="areaList" class="area-list"></div>
</main>
<script>
'use strict';
const DEFAULT_GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbxNQYC7-aBE23cliuD1Zdze18xHh-q45P1qpBgwCCg0dYgxd1b8A-R63eGjzMtgOxMT/exec';
const MASTER_URL='data/public/recraft_alchemia_master.json';
const AFFINITIES=[['physical','物'],['fire','火'],['water','水'],['wind','風'],['thunder','雷'],['light','光'],['dark','闇'],['neutral','無']];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let master={exploration_areas:[],monsters:[]},disclosures={},draftDisclosures={},busy=false,bulkSaving=false;const dirtyMonsterIds=new Set();
function jsonp(data,timeout=30000){return new Promise((resolve,reject)=>{const cb='raBestiaryCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),sc=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(false,new Error('図鑑データの読み込みがタイムアウトしました。')),timeout);function clean(){clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}sc.remove()}function finish(ok,v){if(done)return;done=true;clean();ok?resolve(v):reject(v)}window[cb]=v=>finish(true,v);try{const u=new URL(DEFAULT_GAS_WEB_APP_URL);u.searchParams.set('api','1');u.searchParams.set('callback',cb);Object.entries(data||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v))});u.searchParams.set('_t',Date.now());sc.src=u.toString();sc.onerror=()=>finish(false,new Error('図鑑データへ接続できませんでした。'));document.head.appendChild(sc)}catch(e){finish(false,e)}})}
function post(action,payload,timeout=45000,probe=null){
  return new Promise((resolve,reject)=>{
    const token=String(payload?.token||''),frames=[];
    let done=false,probeStarter=0,probeTimer=0,retryTimer=0,timeoutTimer=0,probing=false,attemptNo=0;
    function clean(){if(probeStarter)clearTimeout(probeStarter);if(probeTimer)clearInterval(probeTimer);if(retryTimer)clearInterval(retryTimer);if(timeoutTimer)clearTimeout(timeoutTimer);window.removeEventListener('message',onMessage);frames.forEach(frame=>setTimeout(()=>{try{frame.remove();}catch(_){}},0));}
    function finish(ok,v){if(done)return;done=true;clean();ok?resolve(v):reject(v)}
    async function runProbe(){if(done||probing||typeof probe!=='function')return;probing=true;try{const verified=await probe();if(verified)finish(true,verified)}catch(_){}finally{probing=false}}
    function onMessage(e){const d=e.data||{};if(d.type!=='recraft-db-post-result'||String(d.token||'')!==token)return;const result=d.result||{ok:false,error:'保存結果が空です。'};if(result.ok===false){finish(false,new Error(result.error||'保存に失敗しました。'));return;}finish(true,result);}
    function submitAttempt(){
      if(done)return;attemptNo++;
      const frame=document.createElement('iframe');frame.name='raBestiaryPost_'+Date.now()+'_'+attemptNo+'_'+Math.random().toString(36).slice(2);frame.style.display='none';frame.setAttribute('aria-hidden','true');document.body.appendChild(frame);frames.push(frame);
      try{const doc=frame.contentDocument||frame.contentWindow?.document;if(!doc)throw new Error('図鑑保存用通信フレームを初期化できませんでした。');const form=doc.createElement('form'),u=new URL(DEFAULT_GAS_WEB_APP_URL);u.searchParams.set('action',action);u.searchParams.set('responseMode','postMessage');u.searchParams.set('token',token);form.method='POST';form.action=u.toString();form.enctype='application/x-www-form-urlencoded';form.acceptCharset='UTF-8';const field=doc.createElement('input');field.type='hidden';field.name='payload';field.value=JSON.stringify(payload||{});form.appendChild(field);doc.body.appendChild(form);form.submit();}
      catch(error){try{frame.remove();}catch(_){}const idx=frames.indexOf(frame);if(idx>=0)frames.splice(idx,1);if(attemptNo===1)finish(false,error);}
    }
    window.addEventListener('message',onMessage);if(typeof probe==='function')probeStarter=setTimeout(()=>{runProbe();probeTimer=setInterval(runProbe,1800)},900);submitAttempt();if(done)return;
    retryTimer=setInterval(()=>{runProbe();submitAttempt()},Math.max(8000,Math.min(15000,Math.floor((Number(timeout)||45000)/4))));
    timeoutTimer=setTimeout(()=>finish(false,new Error('図鑑保存の応答確認がタイムアウトしました。')),Math.max(15000,Number(timeout)||45000));
  });
}

function actions(text=''){
  return String(text||'').split(/\r?\n/).map(line=>String(line||'').trim()).filter(Boolean).map(line=>{
    const cols=line.split('\t');
    return {name:String(cols[0]||'').trim(),actionType:String(cols[1]||'').trim(),checkType:String(cols[2]||'').trim(),target:String(cols[3]||'').trim(),element:String(cols[4]||'').trim(),power:String(cols[5]||'').trim(),effect:String(cols[6]||'').trim(),baseValue:String(cols[7]||'').trim(),range:String(cols[8]||'').trim()};
  }).filter(row=>row.name);
}
function norm(raw={}){
  raw=raw&&typeof raw==='object'?raw:{};
  const affinities={};AFFINITIES.forEach(([key])=>affinities[key]=!!raw.affinities?.[key]);
  const normalizedActions={};
  Object.keys(raw.actions||{}).sort((a,b)=>String(a).localeCompare(String(b),'ja')).forEach(name=>{
    const row=raw.actions?.[name]||{},effect=!!row.effect;
    normalizedActions[name]={info:effect||!!row.info,effect};
  });
  return {encounter:!!raw.encounter,passive:!!raw.passive,affinities,actions:normalizedActions};
}
function sameDisclosure(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b));}
function areas(){
  const monsterRows=Array.isArray(master.monsters)?master.monsters:[];
  const byName=new Map(monsterRows.map(row=>[String(row?.name||'').trim(),row]));
  return (Array.isArray(master.exploration_areas)?master.exploration_areas:[]).map(area=>{
    const areaName=String(area?.name||'').trim(),seen=new Set(),rows=[];
    String(area?.mainMonsters||'').split(/[,、，]/).map(v=>v.trim()).filter(Boolean).forEach(name=>{
      const monster=byName.get(name);if(monster){const id=String(monster.id||monster.name||'');if(!seen.has(id)){seen.add(id);rows.push(monster);}}
    });
    monsterRows.forEach(monster=>{
      if(String(monster?.areaName||'').trim()!==areaName)return;
      const id=String(monster.id||monster.name||'');if(!seen.has(id)){seen.add(id);rows.push(monster);}
    });
    return {id:String(area?.id||''),name:areaName,unlockOrder:Number(area?.unlockOrder||0)||0,monsters:rows};
  }).filter(area=>area.monsters.length).sort((a,b)=>a.unlockOrder-b.unlockOrder||a.name.localeCompare(b.name,'ja'));
}
function fillAreas(){const cur=$('areaFilter').value,$s=$('areaFilter');$s.innerHTML='<option value="">全エリア</option>'+areas().map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');if([...$s.options].some(o=>o.value===cur))$s.value=cur}
function draftDisclosure(id){const key=String(id||'');return norm(Object.prototype.hasOwnProperty.call(draftDisclosures,key)?draftDisclosures[key]:(disclosures[key]||{}))}
function monsterCard(m){const id=String(m.id||''),d=draftDisclosure(id),acts=actions(m.actions||''),passive=String(m.passiveName||'').trim(),named=/^mon_named_/.test(id),dirty=dirtyMonsterIds.has(id);return `<details class="monster-card${dirty?' dirty':''}" data-monster-id="${esc(id)}"><summary><span class="monster-title"><span>${esc(m.name||id)}</span>${named?'<span class="named-badge">二つ名</span>':''}</span></summary><div class="monster-body"><section><div class="section-title">遭遇情報</div><div class="options"><label class="option"><input type="checkbox" data-field="encounter" ${d.encounter?'checked':''}>名称・HP / MP・先制・回避・抵抗・防御を公開</label>${passive?`<label class="option"><input type="checkbox" data-field="passive" ${d.passive?'checked':''}>固有パッシブ「${esc(passive)}」を公開</label>`:''}</div></section>${named?'':`<section><div class="section-title">属性耐性</div><div class="affinity-grid">${AFFINITIES.map(([k,l])=>`<label class="affinity option"><input type="checkbox" data-affinity="${k}" ${d.affinities[k]?'checked':''}>${l}</label>`).join('')}</div></section>`}<section><div class="section-title">行動</div><div class="actions">${acts.length?acts.map(a=>{const ad=d.actions[a.name]||{info:false,effect:false};return `<details class="action-card" data-action-name="${esc(a.name)}"><summary>${esc(a.name)}</summary><div class="action-controls"><label class="option"><input type="checkbox" data-action-info ${ad.info?'checked':''}>行動情報を公開</label><label class="option"><input type="checkbox" data-action-effect ${ad.effect?'checked':''}>効果を公開</label></div></details>`}).join(''):'<div class="notice">行動データなし</div>'}</div></section><div class="save-row"><button type="button" data-save-monster="${esc(id)}">この魔物の公開設定を保存</button><span class="save-state" data-save-state="${esc(id)}"></span></div></div></details>`}
function updateDirtyUi(){
  const count=dirtyMonsterIds.size,saveBtn=$('saveDirtyBtn'),countEl=$('dirtyCount');
  if(countEl)countEl.textContent=`変更 ${count}体`;
  if(saveBtn){saveBtn.disabled=bulkSaving||count===0;saveBtn.textContent=bulkSaving?'保存中…':'変更した魔物を保存';}
}
function syncDraftFromCard(card){
  if(!card)return;
  const id=String(card.dataset.monsterId||'');if(!id)return;
  const next=norm(cardState(card)),saved=norm(disclosures[id]||{});
  if(sameDisclosure(next,saved)){
    delete draftDisclosures[id];dirtyMonsterIds.delete(id);card.classList.remove('dirty');
  }else{
    draftDisclosures[id]=next;dirtyMonsterIds.add(id);card.classList.add('dirty');
  }
  updateDirtyUi();
}
function setBulkSaveProgress(done,total,{visible=true}={}){
  const wrap=$('bulkSaveProgressWrap'),bar=$('bulkSaveProgress'),text=$('bulkSaveProgressText');
  if(!wrap||!bar||!text)return;
  const safeTotal=Math.max(0,Number(total)||0),safeDone=Math.max(0,Math.min(safeTotal,Number(done)||0));
  const percent=safeTotal>0?Math.round((safeDone/safeTotal)*100):0;
  wrap.hidden=!visible;
  bar.value=percent;
  text.textContent=`${percent}%`;
}
function render(){
  const q=$('searchInput').value.trim().toLocaleLowerCase('ja-JP'),areaId=$('areaFilter').value;
  const rows=areas().filter(a=>!areaId||a.id===areaId).map(a=>{
    const areaHit=q&&a.name.toLocaleLowerCase('ja-JP').includes(q),monsters=a.monsters.filter(m=>!q||areaHit||String(m.name||'').toLocaleLowerCase('ja-JP').includes(q));
    return{...a,monsters};
  }).filter(a=>a.monsters.length);
  const total=rows.reduce((n,a)=>n+a.monsters.length,0),named=rows.reduce((n,a)=>n+a.monsters.filter(m=>/^mon_named_/.test(String(m.id||''))).length,0),normal=total-named;
  $('status').className='status ok';
  $('status').textContent=`表示 ${total}体（通常 ${normal}体 / 二つ名 ${named}体） / ${rows.length}エリア`;
  $('areaList').innerHTML=rows.length?rows.map(a=>`<details class="area-group" ${(q||areaId)?'open':''}><summary><span>${esc(a.name)}</span><span class="area-count">${a.monsters.length}体</span></summary><div class="monster-list">${a.monsters.map(monsterCard).join('')}</div></details>`).join(''):'<div class="panel empty">条件に一致する魔物はいません。</div>';
  updateDirtyUi();
}
function cardState(card){const affinities={};AFFINITIES.forEach(([k])=>affinities[k]=!!card.querySelector(`[data-affinity="${k}"]`)?.checked);const acts={};card.querySelectorAll('[data-action-name]').forEach(row=>{const name=row.dataset.actionName,effect=!!row.querySelector('[data-action-effect]')?.checked,info=effect||!!row.querySelector('[data-action-info]')?.checked;acts[name]={info,effect}});return{encounter:!!card.querySelector('[data-field="encounter"]')?.checked,passive:!!card.querySelector('[data-field="passive"]')?.checked,affinities,actions:acts}}
async function save(id,{bulk=false}={}){
  const key=String(id||''),card=document.querySelector(`[data-monster-id="${CSS.escape(key)}"]`),btn=card?.querySelector('[data-save-monster]')||null,state=card?.querySelector('[data-save-state]')||null;
  if(card)syncDraftFromCard(card);
  const disclosure=draftDisclosure(key);
  try{
    if(btn)btn.disabled=true;if(state)state.textContent='保存中…';
    const token='bestiary_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const probe=async()=>{const check=await jsonp({action:'bestiaryDisclosureList'},15000);if(!check||check.ok===false)return null;const saved=check.disclosures?.[key];return saved&&sameDisclosure(saved,disclosure)?{ok:true,monsterId:key,disclosure:norm(saved),verifiedBy:'readback'}:null};
    const res=await post('bestiaryDisclosureSave',{token,monsterId:key,disclosure},45000,probe);
    if(!res||res.ok===false)throw new Error(res?.error||'公開設定の保存に失敗しました。');
    disclosures[key]=norm(res.disclosure||disclosure);delete draftDisclosures[key];dirtyMonsterIds.delete(key);
    card?.classList.remove('dirty');if(state)state.textContent='保存しました。';updateDirtyUi();
    return{ok:true};
  }catch(e){
    const message=String(e?.message||e);if(state)state.textContent='保存失敗：'+message;updateDirtyUi();return{ok:false,error:message};
  }finally{if(btn)btn.disabled=false;}
}
async function saveDirty(){
  if(bulkSaving)return;
  const ids=[...dirtyMonsterIds];
  if(!ids.length){updateDirtyUi();setBulkSaveProgress(0,0,{visible:false});return;}
  bulkSaving=true;updateDirtyUi();setBulkSaveProgress(0,ids.length);
  let saved=0,failed=0;
  for(let i=0;i<ids.length;i++){
    const beforePercent=Math.round((i/ids.length)*100);
    $('status').className='status';$('status').textContent=`保存中… ${beforePercent}%（${i}/${ids.length}体完了）`;
    const result=await save(ids[i],{bulk:true});
    if(result.ok)saved++;else failed++;
    setBulkSaveProgress(i+1,ids.length);
    const percent=Math.round(((i+1)/ids.length)*100);
    $('status').className='status';$('status').textContent=`保存中… ${percent}%（${i+1}/${ids.length}体完了）`;
    updateDirtyUi();
  }
  bulkSaving=false;updateDirtyUi();setBulkSaveProgress(ids.length,ids.length);
  $('status').className=failed?'status error':'status ok';
  $('status').textContent=failed?`100%（${saved}体保存 / ${failed}体失敗）`:`100%（${saved}体保存完了）`;
}
async function load(){if(busy)return;busy=true;$('reloadBtn').disabled=true;$('status').className='status';$('status').textContent='図鑑データと公開状態を読み込んでいます…';try{const [raw,disc]=await Promise.all([fetch(MASTER_URL+'?v=1.0.99',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('魔物マスターを読み込めませんでした。');return r.json()}),jsonp({action:'bestiaryDisclosureList'})]),src=raw?.data&&typeof raw.data==='object'?raw.data:raw;master={exploration_areas:Array.isArray(src?.exploration_areas)?src.exploration_areas:[],monsters:Array.isArray(src?.monsters)?src.monsters:[]};if(!disc||disc.ok===false)throw new Error(disc?.error||'図鑑公開状態を読み込めませんでした。');disclosures=disc.disclosures||{};draftDisclosures={};dirtyMonsterIds.clear();setBulkSaveProgress(0,0,{visible:false});fillAreas();render()}catch(e){$('status').className='status error';$('status').textContent=String(e?.message||e)+'　※ code.txt を更新した場合はGASの再デプロイも必要です。';$('areaList').innerHTML=''}finally{busy=false;$('reloadBtn').disabled=false}}
$('reloadBtn').addEventListener('click',load);
$('searchInput').addEventListener('input',render);
$('areaFilter').addEventListener('change',render);
$('clearFilterBtn').addEventListener('click',()=>{$('searchInput').value='';$('areaFilter').value='';render()});
$('saveDirtyBtn').addEventListener('click',saveDirty);
$('areaList').addEventListener('click',e=>{const b=e.target.closest('[data-save-monster]');if(b)save(b.dataset.saveMonster)});
$('areaList').addEventListener('change',e=>{
  const card=e.target.closest('[data-monster-id]');if(!card)return;
  if(e.target.matches('[data-action-effect]')&&e.target.checked){const row=e.target.closest('[data-action-name]'),info=row?.querySelector('[data-action-info]');if(info)info.checked=true}
  if(e.target.matches('[data-action-info]')&&!e.target.checked){const row=e.target.closest('[data-action-name]'),effect=row?.querySelector('[data-action-effect]');if(effect)effect.checked=false}
  syncDraftFromCard(card);
});
load();
</script></body></html>
