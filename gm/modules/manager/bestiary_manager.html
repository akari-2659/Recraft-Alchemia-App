<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>リクラフト・アルケミア 魔物図鑑管理 v90.8.817</title>
<style>
:root{--bg:#f7f2e8;--paper:#fffaf3;--paper2:#f2e5d1;--ink:#2d241b;--muted:#76695b;--line:#d9c7a8;--accent:#8b5e34;--accent2:#bd8242;--good:#23724b;--bad:#a43d35;--shadow:0 14px 34px rgba(82,52,24,.13)}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",system-ui,sans-serif;background:linear-gradient(180deg,#fff8ea 0%,var(--bg) 44%,#eee0cb 100%);color:var(--ink);min-height:100svh}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.header-inner{width:min(1180px,100%);margin:auto;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,30px);margin:0}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:900;color:var(--muted)}.version{font-size:12px;color:var(--muted);font-weight:800}
main{width:min(1180px,100%);margin:auto;padding:18px;display:grid;gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.notice{margin:0;color:var(--muted);line-height:1.65;font-size:13px}.summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) minmax(180px,280px) auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}input,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:11px;background:#fffdf8;color:var(--ink);padding:10px 11px}button{font:inherit;border:0;border-radius:11px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000 18%));color:#fff;font-weight:850;padding:10px 13px;cursor:pointer}button.secondary{background:var(--paper2);color:var(--ink);border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.48;cursor:not-allowed}
.status{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper2);font-size:13px;color:var(--muted)}.status.ok{color:var(--good)}.status.error{color:var(--bad)}.area-list{display:grid;gap:12px}.area-group{border:1px solid var(--line);border-radius:15px;background:var(--paper);overflow:hidden}.area-group>summary{cursor:pointer;padding:12px 14px;background:var(--paper2);font-weight:900;display:flex;justify-content:space-between;gap:10px;list-style:none}.area-group>summary::-webkit-details-marker{display:none}.area-count{font-size:12px;color:var(--muted);font-weight:800}.monster-list{display:grid;gap:9px;padding:11px}.monster-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.monster-card>summary{cursor:pointer;padding:10px 12px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.monster-card.dirty>summary::after{content:"未保存";font-size:11px;padding:3px 7px;border-radius:999px;background:#fff0cf;color:#8b5c00;border:1px solid #e8c377}.monster-title{display:flex;align-items:center;gap:8px;min-width:0}.named-badge{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;background:#f2e4cf}.monster-body{padding:0 12px 12px;display:grid;gap:13px}.section-title{font-weight:900;margin-bottom:7px}.options{display:flex;flex-wrap:wrap;gap:8px 14px}.option{display:inline-flex;align-items:flex-start;gap:7px;font-weight:800;font-size:13px;line-height:1.45}.option input{width:auto;margin-top:2px}.affinity-grid{display:grid;grid-template-columns:repeat(8,minmax(60px,1fr));gap:6px}.affinity{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fffdf8}.actions{display:grid;gap:7px}.action-card{border:1px solid var(--line);border-radius:10px;background:#fffdf8;overflow:hidden}.action-card>summary{cursor:pointer;padding:8px 10px;font-weight:850;background:color-mix(in srgb,var(--paper2) 70%,#fff 30%)}.action-controls{display:flex;flex-wrap:wrap;gap:10px 16px;padding:10px}.save-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.save-state{font-size:12px;color:var(--muted)}
.bulk-save-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bulk-save-bar .selection-count{font-size:12px;color:var(--muted);font-weight:800;margin-right:auto}
.bulk-save-progress{display:grid;grid-template-columns:minmax(120px,240px) auto;gap:8px;align-items:center;width:100%;margin-top:4px}.bulk-save-progress[hidden]{display:none}.bulk-save-progress progress{width:100%;height:12px;accent-color:var(--accent)}.bulk-save-progress span{min-width:44px;text-align:right;font-weight:900;font-size:12px}
.monster-select{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;font-weight:800;color:var(--muted)}
.monster-select input{width:auto;margin:0}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.affinity-grid{grid-template-columns:repeat(4,1fr)}.header-inner{align-items:flex-start}}
</style></head>
<body class="ra-app"><header><div class="header-inner"><div><div class="eyebrow">BESTIARY MANAGEMENT</div><h1>魔物図鑑管理</h1></div><div class="version">RA v90.8.817</div></div></header>
<main>
<section class="panel"><div class="summary-row"><p class="notice">プレイヤー側の魔物図鑑へ公開する情報を管理します。通常個体・二つ名個体の両方が対象です。効果を公開すると、その行動情報も自動で公開されます。</p><button id="reloadBtn" type="button" class="secondary">再読込</button></div></section>
<section class="panel"><div class="toolbar"><div class="field"><label for="searchInput">検索</label><input id="searchInput" type="search" placeholder="魔物名・エリア名で検索"></div><div class="field"><label for="areaFilter">エリア</label><select id="areaFilter"><option value="">全エリア</option></select></div><div class="field"><label>&nbsp;</label><button id="clearFilterBtn" type="button" class="secondary">絞り込み解除</button></div></div></section>
<section class="panel"><div class="bulk-save-bar"><span id="selectionCount" class="selection-count">0体選択</span><button id="selectVisibleBtn" type="button" class="secondary">表示中を選択</button><button id="clearSelectionBtn" type="button" class="secondary">選択解除</button><button id="saveSelectedBtn" type="button" disabled>選択した魔物を保存</button><div id="bulkSaveProgressWrap" class="bulk-save-progress" hidden><progress id="bulkSaveProgress" max="100" value="0"></progress><span id="bulkSaveProgressText">0%</span></div></div></section>
<div id="status" class="status">図鑑公開状態を読み込んでいます…</div><div id="areaList" class="area-list"></div>
</main>
<script>
'use strict';
const DEFAULT_GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbxNQYC7-aBE23cliuD1Zdze18xHh-q45P1qpBgwCCg0dYgxd1b8A-R63eGjzMtgOxMT/exec';
const MASTER_URL='data/public/recraft_alchemia_master.json';
const AFFINITIES=[['physical','物'],['fire','火'],['water','水'],['wind','風'],['thunder','雷'],['light','光'],['dark','闇'],['neutral','無']];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let master={exploration_areas:[],monsters:[]},disclosures={},busy=false,bulkSaving=false;const selectedMonsterIds=new Set();
function jsonp(data,timeout=30000){return new Promise((resolve,reject)=>{const cb='raBestiaryCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),sc=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(false,new Error('図鑑データの読み込みがタイムアウトしました。')),timeout);function clean(){clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}sc.remove()}function finish(ok,v){if(done)return;done=true;clean();ok?resolve(v):reject(v)}window[cb]=v=>finish(true,v);try{const u=new URL(DEFAULT_GAS_WEB_APP_URL);u.searchParams.set('api','1');u.searchParams.set('callback',cb);Object.entries(data||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v))});u.searchParams.set('_t',Date.now());sc.src=u.toString();sc.onerror=()=>finish(false,new Error('図鑑データへ接続できませんでした。'));document.head.appendChild(sc)}catch(e){finish(false,e)}})}
function post(action,payload,timeout=45000,probe=null){return new Promise((resolve,reject)=>{const token=String(payload?.token||''),frame=document.createElement('iframe'),form=document.createElement('form'),name='raBestiaryPost_'+Date.now()+'_'+Math.random().toString(36).slice(2);frame.name=name;frame.style.display='none';frame.setAttribute('aria-hidden','true');form.method='POST';form.target=name;form.enctype='text/plain';form.acceptCharset='UTF-8';form.style.display='none';const u=new URL(DEFAULT_GAS_WEB_APP_URL);u.searchParams.set('action',action);u.searchParams.set('responseMode','postMessage');u.searchParams.set('token',token);form.action=u.toString();const field=document.createElement('textarea');field.name='payload';field.value=JSON.stringify(payload||{});field.style.display='none';form.appendChild(field);let done=false,probeStarter=0,probeTimer=0,probing=false;const timer=setTimeout(async()=>{if(typeof probe==='function'){try{const verified=await probe();if(verified){finish(true,verified);return}}catch(_){}}finish(false,new Error('保存結果を確認できませんでした。再読込して反映状態を確認してください。'))},timeout);function clean(){clearTimeout(timer);if(probeStarter)clearTimeout(probeStarter);if(probeTimer)clearInterval(probeTimer);window.removeEventListener('message',onMessage);setTimeout(()=>{frame.remove();form.remove()},0)}function finish(ok,v){if(done)return;done=true;clean();ok?resolve(v):reject(v)}async function runProbe(){if(done||probing||typeof probe!=='function')return;probing=true;try{const verified=await probe();if(verified)finish(true,verified)}catch(_){}finally{probing=false}}function onMessage(e){if(e.source!==frame.contentWindow)return;const d=e.data||{};if(d.type!=='recraft-db-post-result'||String(d.token||'')!==token)return;finish(true,d.result||{ok:false,error:'保存結果が空です。'})}window.addEventListener('message',onMessage);if(typeof probe==='function'){probeStarter=setTimeout(()=>{runProbe();probeTimer=setInterval(runProbe,2000)},1800)}document.body.append(frame,form);form.submit()})}
function norm(raw){raw=raw&&typeof raw==='object'?raw:{};const affinities={},actions={};AFFINITIES.forEach(([k])=>affinities[k]=!!raw?.affinities?.[k]);Object.entries(raw.actions||{}).forEach(([name,row])=>{const effect=!!row?.effect;actions[name]={info:effect||!!row?.info,effect}});return{encounter:!!raw.encounter,passive:!!raw.passive,affinities,actions}}
function sameDisclosure(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b))}
function actions(value){const raw=String(value||'').trim();if(!raw)return[];try{const arr=JSON.parse(raw);if(Array.isArray(arr))return arr.map(r=>({name:String(r?.name||'').trim()})).filter(r=>r.name)}catch(_){}return raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>({name:String(line.split('\t')[0]||'').trim()})).filter(r=>r.name)}
function areas(){
  const monsters=master.monsters||[],byName=new Map(monsters.map(m=>[String(m.name||'').trim(),m]));
  const source=(master.exploration_areas||[]).map(a=>{
    const names=String(a.mainMonsters||'').split(/[,、，]/).map(v=>v.trim()).filter(Boolean),list=names.map(n=>byName.get(n)).filter(Boolean);
    monsters.forEach(m=>{if(String(m.areaName||'').trim()===String(a.name||'').trim()&&!list.some(x=>String(x.id)===String(m.id)))list.push(m)});
    return{id:String(a.id||''),name:String(a.name||''),order:Number(a.unlockOrder||0)||0,monsters:list};
  }).sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'ja'));
  const assigned=new Set(),rows=source.map(a=>({...a,monsters:a.monsters.filter(m=>{const id=String(m.id||'');if(!id||assigned.has(id))return false;assigned.add(id);return true;})})).filter(a=>a.monsters.length);
  const rest=monsters.filter(m=>!assigned.has(String(m.id||'')));
  if(rest.length)rows.push({id:'__other__',name:'その他 / エリア未割当',order:9999,monsters:rest});
  return rows;
}
function fillAreas(){const cur=$('areaFilter').value,$s=$('areaFilter');$s.innerHTML='<option value="">全エリア</option>'+areas().map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');if([...$s.options].some(o=>o.value===cur))$s.value=cur}
function monsterCard(m){const id=String(m.id||''),d=norm(disclosures[id]||{}),acts=actions(m.actions||''),passive=String(m.passiveName||'').trim(),named=/^mon_named_/.test(id),selected=selectedMonsterIds.has(id);return `<details class="monster-card" data-monster-id="${esc(id)}"><summary><span class="monster-title"><label class="monster-select" title="まとめて保存する魔物を選択"><input type="checkbox" data-select-monster="${esc(id)}" ${selected?'checked':''}><span>選択</span></label><span>${esc(m.name||id)}</span>${named?'<span class="named-badge">二つ名</span>':''}</span></summary><div class="monster-body"><section><div class="section-title">遭遇情報</div><div class="options"><label class="option"><input type="checkbox" data-field="encounter" ${d.encounter?'checked':''}>名称・HP / MP・先制・回避・抵抗・防御を公開</label>${passive?`<label class="option"><input type="checkbox" data-field="passive" ${d.passive?'checked':''}>固有パッシブ「${esc(passive)}」を公開</label>`:''}</div></section><section><div class="section-title">属性耐性</div><div class="affinity-grid">${AFFINITIES.map(([k,l])=>`<label class="affinity option"><input type="checkbox" data-affinity="${k}" ${d.affinities[k]?'checked':''}>${l}</label>`).join('')}</div></section><section><div class="section-title">行動</div><div class="actions">${acts.length?acts.map(a=>{const ad=d.actions[a.name]||{info:false,effect:false};return `<details class="action-card" data-action-name="${esc(a.name)}"><summary>${esc(a.name)}</summary><div class="action-controls"><label class="option"><input type="checkbox" data-action-info ${ad.info?'checked':''}>行動情報を公開</label><label class="option"><input type="checkbox" data-action-effect ${ad.effect?'checked':''}>効果を公開</label></div></details>`}).join(''):'<div class="notice">行動データなし</div>'}</div></section><div class="save-row"><button type="button" data-save-monster="${esc(id)}">この魔物の公開設定を保存</button><span class="save-state" data-save-state="${esc(id)}"></span></div></div></details>`}
function visibleMonsterIds(){return [...document.querySelectorAll('[data-monster-id]')].map(card=>String(card.dataset.monsterId||'')).filter(Boolean)}
function updateSelectionUi(){
  const count=selectedMonsterIds.size,saveBtn=$('saveSelectedBtn'),clearBtn=$('clearSelectionBtn');
  $('selectionCount').textContent=`${count}体選択`;
  if(saveBtn){saveBtn.disabled=bulkSaving||count===0;saveBtn.textContent=bulkSaving?'保存中…':'選択した魔物を保存';}
  if(clearBtn)clearBtn.disabled=bulkSaving||count===0;
  if($('selectVisibleBtn'))$('selectVisibleBtn').disabled=bulkSaving||visibleMonsterIds().length===0;
}
function setBulkSaveProgress(done,total,{visible=true}={}){
  const wrap=$('bulkSaveProgressWrap'),bar=$('bulkSaveProgress'),text=$('bulkSaveProgressText');
  if(!wrap||!bar||!text)return;
  const safeTotal=Math.max(0,Number(total)||0),safeDone=Math.max(0,Math.min(safeTotal,Number(done)||0));
  const percent=safeTotal>0?Math.round((safeDone/safeTotal)*100):0;
  wrap.hidden=!visible;
  bar.value=percent;
  text.textContent=`${percent}%`;
}
function render(){
  const q=$('searchInput').value.trim().toLocaleLowerCase('ja-JP'),areaId=$('areaFilter').value;
  const rows=areas().filter(a=>!areaId||a.id===areaId).map(a=>{
    const areaHit=q&&a.name.toLocaleLowerCase('ja-JP').includes(q),monsters=a.monsters.filter(m=>!q||areaHit||String(m.name||'').toLocaleLowerCase('ja-JP').includes(q));
    return{...a,monsters};
  }).filter(a=>a.monsters.length);
  const total=rows.reduce((n,a)=>n+a.monsters.length,0),named=rows.reduce((n,a)=>n+a.monsters.filter(m=>/^mon_named_/.test(String(m.id||''))).length,0),normal=total-named;
  $('status').className='status ok';
  $('status').textContent=`表示 ${total}体（通常 ${normal}体 / 二つ名 ${named}体） / ${rows.length}エリア`;
  $('areaList').innerHTML=rows.length?rows.map(a=>`<details class="area-group" ${(q||areaId)?'open':''}><summary><span>${esc(a.name)}</span><span class="area-count">${a.monsters.length}体</span></summary><div class="monster-list">${a.monsters.map(monsterCard).join('')}</div></details>`).join(''):'<div class="panel empty">条件に一致する魔物はいません。</div>';
  updateSelectionUi();
}
function cardState(card){const affinities={};AFFINITIES.forEach(([k])=>affinities[k]=!!card.querySelector(`[data-affinity="${k}"]`)?.checked);const acts={};card.querySelectorAll('[data-action-name]').forEach(row=>{const name=row.dataset.actionName,effect=!!row.querySelector('[data-action-effect]')?.checked,info=effect||!!row.querySelector('[data-action-info]')?.checked;acts[name]={info,effect}});return{encounter:!!card.querySelector('[data-field="encounter"]')?.checked,passive:!!card.querySelector('[data-field="passive"]')?.checked,affinities,actions:acts}}
async function save(id,{bulk=false}={}){
  const card=document.querySelector(`[data-monster-id="${CSS.escape(String(id))}"]`);if(!card)return{ok:false,error:'画面上に対象がありません。'};
  const btn=card.querySelector('[data-save-monster]'),state=card.querySelector('[data-save-state]');
  try{
    if(btn)btn.disabled=true;if(state)state.textContent='保存中…';
    const disclosure=cardState(card),token='bestiary_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const probe=async()=>{const check=await jsonp({action:'bestiaryDisclosureList'},15000);if(!check||check.ok===false)return null;const saved=check.disclosures?.[String(id)];return saved&&sameDisclosure(saved,disclosure)?{ok:true,monsterId:String(id),disclosure:norm(saved),verifiedBy:'readback'}:null};
    const res=await post('bestiaryDisclosureSave',{token,monsterId:String(id),disclosure},45000,probe);
    if(!res||res.ok===false)throw new Error(res?.error||'公開設定の保存に失敗しました。');
    disclosures[String(id)]=norm(res.disclosure||disclosure);card.classList.remove('dirty');if(state)state.textContent='保存しました。';
    return{ok:true};
  }catch(e){
    const message=String(e?.message||e);if(state)state.textContent='保存失敗：'+message;return{ok:false,error:message};
  }finally{if(btn)btn.disabled=false;}
}
async function saveSelected(){
  if(bulkSaving)return;
  const ids=[...selectedMonsterIds].filter(id=>document.querySelector(`[data-monster-id="${CSS.escape(String(id))}"]`));
  if(!ids.length){selectedMonsterIds.clear();updateSelectionUi();setBulkSaveProgress(0,0,{visible:false});return;}
  bulkSaving=true;updateSelectionUi();setBulkSaveProgress(0,ids.length);
  let saved=0,failed=0;
  for(let i=0;i<ids.length;i++){
    const beforePercent=Math.round((i/ids.length)*100);
    $('status').className='status';$('status').textContent=`保存中… ${beforePercent}%（${i}/${ids.length}体完了）`;
    const result=await save(ids[i],{bulk:true});
    if(result.ok){saved++;selectedMonsterIds.delete(ids[i]);const cb=document.querySelector(`[data-select-monster="${CSS.escape(String(ids[i]))}"]`);if(cb)cb.checked=false;}
    else failed++;
    setBulkSaveProgress(i+1,ids.length);
    const percent=Math.round(((i+1)/ids.length)*100);
    $('status').className='status';$('status').textContent=`保存中… ${percent}%（${i+1}/${ids.length}体完了）`;
    updateSelectionUi();
  }
  bulkSaving=false;updateSelectionUi();setBulkSaveProgress(ids.length,ids.length);
  $('status').className=failed?'status error':'status ok';
  $('status').textContent=failed?`100%（${saved}体保存 / ${failed}体失敗）`:`100%（${saved}体保存完了）`;
}
async function load(){if(busy)return;busy=true;$('reloadBtn').disabled=true;$('status').className='status';$('status').textContent='図鑑データと公開状態を読み込んでいます…';try{const [raw,disc]=await Promise.all([fetch(MASTER_URL+'?v=1.0.85&_t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('魔物マスターを読み込めませんでした。');return r.json()}),jsonp({action:'bestiaryDisclosureList'})]),src=raw?.data&&typeof raw.data==='object'?raw.data:raw;master={exploration_areas:Array.isArray(src?.exploration_areas)?src.exploration_areas:[],monsters:Array.isArray(src?.monsters)?src.monsters:[]};if(!disc||disc.ok===false)throw new Error(disc?.error||'図鑑公開状態を読み込めませんでした。');disclosures=disc.disclosures||{};fillAreas();render()}catch(e){$('status').className='status error';$('status').textContent=String(e?.message||e)+'　※ code.txt を更新した場合はGASの再デプロイも必要です。';$('areaList').innerHTML=''}finally{busy=false;$('reloadBtn').disabled=false}}
$('reloadBtn').addEventListener('click',load);
$('searchInput').addEventListener('input',render);
$('areaFilter').addEventListener('change',render);
$('clearFilterBtn').addEventListener('click',()=>{$('searchInput').value='';$('areaFilter').value='';render()});
$('selectVisibleBtn').addEventListener('click',()=>{visibleMonsterIds().forEach(id=>selectedMonsterIds.add(id));document.querySelectorAll('[data-select-monster]').forEach(cb=>cb.checked=true);updateSelectionUi()});
$('clearSelectionBtn').addEventListener('click',()=>{selectedMonsterIds.clear();document.querySelectorAll('[data-select-monster]').forEach(cb=>cb.checked=false);updateSelectionUi();setBulkSaveProgress(0,0,{visible:false})});
$('saveSelectedBtn').addEventListener('click',saveSelected);
$('areaList').addEventListener('click',e=>{if(e.target.closest('[data-select-monster]'))e.stopPropagation();const b=e.target.closest('[data-save-monster]');if(b)save(b.dataset.saveMonster)});
$('areaList').addEventListener('change',e=>{
  if(e.target.matches('[data-select-monster]')){const id=String(e.target.dataset.selectMonster||'');if(e.target.checked)selectedMonsterIds.add(id);else selectedMonsterIds.delete(id);updateSelectionUi();return;}
  const card=e.target.closest('[data-monster-id]');if(card)card.classList.add('dirty');
  if(e.target.matches('[data-action-effect]')&&e.target.checked){const row=e.target.closest('[data-action-name]'),info=row?.querySelector('[data-action-info]');if(info)info.checked=true}
  if(e.target.matches('[data-action-info]')&&!e.target.checked){const row=e.target.closest('[data-action-name]'),effect=row?.querySelector('[data-action-effect]');if(effect)effect.checked=false}
});
load();
</script></body></html>
