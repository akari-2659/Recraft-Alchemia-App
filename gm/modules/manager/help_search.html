<style>.search-shell{max-width:1200px;margin:0 auto;padding:18px}.search-top{display:grid;gap:12px}.rule-search-input{font-size:18px;padding:14px 16px;border-radius:12px;border:1px solid var(--line,#555);width:100%;box-sizing:border-box}.scope-row{display:flex;gap:8px;flex-wrap:wrap}.scope-btn{padding:8px 12px;border-radius:999px;border:1px solid var(--line,#555);background:transparent;color:inherit;cursor:pointer}.scope-btn.active{font-weight:700;outline:2px solid currentColor}.search-meta{opacity:.75;font-size:13px}.results{display:grid;gap:10px;margin-top:16px}.result-card{border:1px solid var(--line,#555);border-radius:14px;padding:14px;background:var(--panel,#1111)}.result-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scope-badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.85}.result-tags{font-size:12px;opacity:.7}.result-body{margin-top:10px}.empty{padding:30px;text-align:center;opacity:.7}</style></head><body class="ra-app ra-manager ra-help"><div class="ra-build-info">横断検索 / 2026年10月5日</div><div class="search-shell"><header><div class="title-card"><h1>Recraft-Alchemia ルール横断検索</h1><p class="subtitle">プレイヤー／GM／アプリ／開発・監査の4つの正本をまとめて検索します。</p></div></header><main><section class="panel search-top"><input id="ruleSearch" class="rule-search-input" type="search" placeholder="例：妨害、探索、全滅、防御無視、レシピ"/><div class="scope-row" id="scopeRow"><button class="scope-btn active" data-scope="all">すべて</button><button class="scope-btn" data-scope="player">プレイヤー</button><button class="scope-btn" data-scope="gm">GM</button><button class="scope-btn" data-scope="app">アプリ</button><button class="scope-btn" data-scope="design">開発・監査</button></div><div class="search-meta" id="searchMeta">検索語を入力すると全ルールから検索します。</div></section><section class="results" id="results"></section></main></div><script>const DATA=[{"key":"player-0","scope":"player","scopeLabel":"プレイヤー","title":"ランクと解放","tags":["★","ランク"],"html":"\u003cul>\u003cli>ランクを持つデータは★1、★2のように表示する。ランクは性能・難易度の目安で、実際の解放はエリア進行・施設解放に従う。\u003c/li>\u003cli>道具は対応上限以下の対象に使用でき、上位段階の道具を使うと自作難易度を下げられる。\u003c/li>\u003c/ul>","text":"ランクを持つデータは★1、★2のように表示する。ランクは性能・難易度の目安で、実際の解放はエリア進行・施設解放に従う。 道具は対応上限以下の対象に使用でき、上位段階の道具を使うと自作難易度を下げられる。"},{"key":"player-1","scope":"player","scopeLabel":"プレイヤー","title":"施設","tags":["鍛冶屋","薬屋","食事処","宿屋","骨董屋"],"html":"\u003cul>\n\u003cli>基本施設は鍛冶屋、薬屋、食事処、宿屋、骨董屋、ギルド。\u003c/li>\n\u003cli>鍛冶屋では武器・盾・防具・バッグ・矢筒・鍛冶素材・戦闘用罠・細工道具などを扱い、武器・防具作成や装備強化を依頼できる。\u003c/li>\n\u003cli>薬屋ではポーション・薬品・調合素材を扱い、調合作業を依頼できる。\u003c/li>\n\u003cli>食事処では解放エリアに応じた料理や、食材持ち込み料理を利用できる。\u003c/li>\n\u003cli>宿屋では宿泊45G、休息30G、噂、クエスト情報を扱う。休息は1行動を消費してHP・MP全回復、宿泊は翌日へ進みHP・MP全回復・疲労度0。\u003c/li>\n\u003cli>骨董屋では骨董品・術式関連品など、その時点で販売されている商品を購入できる。\u003c/li>\n\u003c/ul>","text":"基本施設は鍛冶屋、薬屋、食事処、宿屋、骨董屋、ギルド。 鍛冶屋では武器・盾・防具・バッグ・矢筒・鍛冶素材・戦闘用罠・細工道具などを扱い、武器・防具作成や装備強化を依頼できる。 薬屋ではポーション・薬品・調合素材を扱い、調合作業を依頼できる。 食事処では解放エリアに応じた料理や、食材持ち込み料理を利用できる。 宿屋では宿泊45G、休息30G、噂、クエスト情報を扱う。休息は1行動を消費してHP・MP全回復、宿泊は翌日へ進みHP・MP全回復・疲労度0。 骨董屋では骨董品・術式関連品など、その時点で販売されている商品を購入できる。"},{"key":"player-2","scope":"player","scopeLabel":"プレイヤー","title":"1日の行動回数・疲労","tags":["行動回数","疲労"],"html":"\u003cul>\u003cli>基本行動回数はパーティー共通で1日4回。疲労度1につき、その日の行動可能回数が1回減少する。最低1回。\u003c/li>\u003cli>疲労度1につき、すべての判定へ-2。疲労度0なら補正なし。\u003c/li>\u003cli>エリア探索を1回開始するごとに1行動を消費する。隠しエリアへ途中侵入する場合は、さらに1行動を消費する。\u003c/li>\u003cli>行動回数を使い切ったら、その日の新しい行動は開始できない。\u003c/li>\u003cli>宿泊せず一日を終えると疲労度+1。宿屋で宿泊すると翌日に進み、HP・MP全回復、疲労度0。休息は1行動を消費してHP・MPを全回復するが、日付と疲労度は変化しない。\u003c/li>\u003c/ul>","text":"基本行動回数はパーティー共通で1日4回。疲労度1につき、その日の行動可能回数が1回減少する。最低1回。 疲労度1につき、すべての判定へ-2。疲労度0なら補正なし。 エリア探索を1回開始するごとに1行動を消費する。隠しエリアへ途中侵入する場合は、さらに1行動を消費する。 行動回数を使い切ったら、その日の新しい行動は開始できない。 宿泊せず一日を終えると疲労度+1。宿屋で宿泊すると翌日に進み、HP・MP全回復、疲労度0。休息は1行動を消費してHP・MPを全回復するが、日付と疲労度は変化しない。"},{"key":"player-3","scope":"player","scopeLabel":"プレイヤー","title":"1回の探索","tags":["探索","進行度","イベント"],"html":"\u003cul>\u003cli>エリア探索を開始すると、その探索専用の進行度を0%から開始する。探索開始時にその日の行動回数を1回消費する。\u003c/li>\u003cli>探索では、現在の進行度に対応するイベントを先に解決する。0%もイベント発生地点として扱う。\u003c/li>\u003cli>イベントを解決した後に探索進行度を、そのエリアに設定された進行上昇値だけ進める。進行後の地点で次のイベントを解決し、これを100%まで繰り返す。\u003c/li>\u003cli>100%もイベント発生地点として扱う。進行上昇値25%なら、0%・25%・50%・75%・100%の計5回イベントが発生する。\u003c/li>\u003cli>同じ探索中、一度発生した通常のエリアイベントは原則として再登場しない。二つ名遭遇など個別に再抽選を許可するものは、その個別ルールを優先する。\u003c/li>\u003cli>通常エリアでは現在の時間帯・その日の天気・選択した宿屋の噂がイベント候補や魔物の出現傾向へ影響する。異界では天気・時間帯を使用しない。\u003c/li>\u003cli>戦闘イベントが発生した場合は、その戦闘を解決し、戦闘後の採取・ドロップ処理まで終えてから探索へ戻る。\u003c/li>\u003cli>隠しエリア入口が成立した場合、その場で追加1行動を消費して隠しエリア探索へ入れる。隠しエリア探索終了後は、元の探索へ戻る。\u003c/li>\u003cli>探索は途中で任意に終了して拠点へ戻ってよい。その探索の進行度は次回へ持ち越さず、次の探索は0%から新しく開始する。すでに獲得したアイテム等は通常どおり保持する。\u003c/li>\u003cli>100%地点のイベントを解決したら、その1回の探索は完了する。\u003c/li>\u003c/ul>","text":"エリア探索を開始すると、その探索専用の進行度を0%から開始する。探索開始時にその日の行動回数を1回消費する。 探索では、現在の進行度に対応するイベントを先に解決する。0%もイベント発生地点として扱う。 イベントを解決した後に探索進行度を、そのエリアに設定された進行上昇値だけ進める。進行後の地点で次のイベントを解決し、これを100%まで繰り返す。 100%もイベント発生地点として扱う。進行上昇値25%なら、0%・25%・50%・75%・100%の計5回イベントが発生する。 同じ探索中、一度発生した通常のエリアイベントは原則として再登場しない。二つ名遭遇など個別に再抽選を許可するものは、その個別ルールを優先する。 通常エリアでは現在の時間帯・その日の天気・選択した宿屋の噂がイベント候補や魔物の出現傾向へ影響する。異界では天気・時間帯を使用しない。 戦闘イベントが発生した場合は、その戦闘を解決し、戦闘後の採取・ドロップ処理まで終えてから探索へ戻る。 隠しエリア入口が成立した場合、その場で追加1行動を消費して隠しエリア探索へ入れる。隠しエリア探索終了後は、元の探索へ戻る。 探索は途中で任意に終了して拠点へ戻ってよい。その探索の進行度は次回へ持ち越さず、次の探索は0%から新しく開始する。すでに獲得したアイテム等は通常どおり保持する。 100%地点のイベントを解決したら、その1回の探索は完了する。"},{"key":"player-4","scope":"player","scopeLabel":"プレイヤー","title":"状態・フィールド","tags":["状態","戦闘","フィールド"],"html":"\n\u003cul>\n\u003cli>行動に状態名が記載されている場合、効果は共通状態定義を参照する。同名状態は原則として自己重複せず、再付与は残り期間を更新する。段階制状態は各状態の段階ルールに従う。\u003c/li>\n\u003cli>戦闘用の状態・バフ・デバフ・継続効果は原則として戦闘終了時に解除する。\u003c/li>\n\u003cli>状態自身に解除条件が定義されている場合、その解除条件を優先する。通常の数値バフ・デバフは、重複不可の指定がなければ累積する。\u003c/li>\n\u003c/ul>\n\u003cdl>\u003cdt>\u003cb>毒状態\u003c/b>\u003c/dt>\u003cdd>ラウンド終了時に1D3の無属性防御無視ダメージ。戦闘終了後に解除。\u003c/dd>\u003cdt>\u003cb>汚染\u003c/b>\u003c/dt>\u003cdd>※汚染I：この戦闘中、受けるHP回復量-2（最低0）。 ※汚染II：この戦闘中、受けるHP回復量-4（最低0）。 ※汚染III：この戦闘中、HP・MPを回復できない。 ※汚染の段階：再度付与された場合は行動に記載された段階数だけ上昇し、最大III。下位段階の効果は加算せず、現在段階の効果だけを適用する。戦闘終了時に解除。\u003c/dd>\u003cdt>\u003cb>呪い\u003c/b>\u003c/dt>\u003cdd>※呪いI：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-1。 ※呪いII：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-2。 ※呪いIII：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-3。 ※呪いの段階：再度付与された場合は行動に記載された段階数だけ上昇し、最大III。下位段階の効果は加算せず、現在段階の効果だけを適用する。戦闘終了時に解除。\u003c/dd>\u003cdt>\u003cb>鏡蝕状態\u003c/b>\u003c/dt>\u003cdd>攻撃判定・魔法判定・祈祷判定-1。戦闘終了後に解除。\u003c/dd>\u003cdt>\u003cb>拘束状態\u003c/b>\u003c/dt>\u003cdd>回避値-2。前衛・後衛間を移動できない（通常移動・強制移動とも不可）。次に回避値を参照される攻撃1回の解決後に解除する。\u003c/dd>\u003cdt>\u003cb>根牢状態\u003c/b>\u003c/dt>\u003cdd>回避値-2。自身の手番に行動1回を消費し、力業判定または細工判定（目標値10）に成功すると解除する。戦闘終了時に解除する。\u003c/dd>\u003cdt>\u003cb>萎縮状態\u003c/b>\u003c/dt>\u003cdd>攻撃判定・魔法判定・祈祷判定-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>泥まみれ状態\u003c/b>\u003c/dt>\u003cdd>攻撃判定-1、回避値-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>胞子状態\u003c/b>\u003c/dt>\u003cdd>魔法判定・祈祷判定-1、抵抗値-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>侵蝕胞子状態\u003c/b>\u003c/dt>\u003cdd>次のラウンド終了まで魔法判定・祈祷判定-1、抵抗値-1。また、2ラウンドの間、各ラウンド終了時に1D3の無属性防御無視ダメージ。2ラウンド目の終了時に解除。\u003c/dd>\u003cdt>\u003cb>粘着状態\u003c/b>\u003c/dt>\u003cdd>回避値-2、防御行動値-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>視界不良状態\u003c/b>\u003c/dt>\u003cdd>攻撃判定-1、回避値-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>体勢崩れ状態\u003c/b>\u003c/dt>\u003cdd>常時防御値-1。次のラウンド終了時に解除する。\u003c/dd>\u003cdt>\u003cb>睡眠状態\u003c/b>\u003c/dt>\u003cdd>覚醒するまで通常移動および行動を行えない。自身の手番開始時に覚醒判定（2D6&gt;=8）を行い、成功すると解除し、その手番は通常どおり行動できる。戦闘終了時にも解除する。\u003c/dd>\u003cdt>\u003cb>麻痺状態\u003c/b>\u003c/dt>\u003cdd>前衛・後衛間の通常移動不可。強制移動は受ける。攻撃判定・魔法判定・祈祷判定・妨害判定・かばう判定-2。戦闘終了時に解除する。\u003c/dd>\u003cdt>\u003cb>火傷状態\u003c/b>\u003c/dt>\u003cdd>2ラウンドの間、各ラウンド終了時に1D3の火属性防御無視ダメージ。同じ技・効果の火傷は重複せず、再付与時は残り期間を2ラウンドへ更新。戦闘終了時にも解除。\u003c/dd>\u003cdt>\u003cb>注目状態\u003c/b>\u003c/dt>\u003cdd>付与された対象は、敵からの単体を対象とする行動の最優先対象となる。複数対象では可能な限り含める。対象条件・射程は変えない。付与時に指定した期限で解除。\u003c/dd>\u003cdt>\u003cb>注視状態\u003c/b>\u003c/dt>\u003cdd>付与された対象は、この状態を付与した対象を付与されていない仲間より最優先で攻撃する。単体ではその対象を選び、複数対象では可能な限り含める。同じ状態が付与されている味方間での処理順は自由に決めて良い。\u003c/dd>\u003cdt>\u003cb>威圧状態\u003c/b>\u003c/dt>\u003cdd>この状態を付与した対象を選べる場合、次の手番の行動は防御、またはその対象を含む行動から選ぶ。選べない場合は行動制限なし。その手番終了時に解除。\u003c/dd>\u003cdt>\u003cb>足止め状態\u003c/b>\u003c/dt>\u003cdd>前衛・後衛間の通常移動不可。強制移動は受ける。次の自身の手番終了時に解除。\u003c/dd>\u003cdt>\u003cb>移動封鎖状態\u003c/b>\u003c/dt>\u003cdd>前衛・後衛間を移動できない（通常移動・強制移動とも不可）。付与時に指定した期限で解除。\u003c/dd>\u003cdt>\u003cb>射線遮断状態\u003c/b>\u003c/dt>\u003cdd>敵後衛を対象に含む行動を選べない。敵後衛しか残っていない場合は制限なし。次の自身の手番終了時に解除。\u003c/dd>\u003cdt>\u003cb>裂傷状態\u003c/b>\u003c/dt>\u003cdd>次に2D6を振る判定を行った直後、1D3+1のHP喪失（防御無視・軽減不可）を受けて解除。判定しなくても次のラウンド終了時に解除。同名効果は重複せず、再付与時は期限を更新。\u003c/dd>\u003cdt>\u003cb>雷絡状態\u003c/b>\u003c/dt>\u003cdd>命中した最終対象と、同じ列の別PCからランダムに1人を選んで対にする。別PCがいなければ付与しない。どちらかが列移動した時点で両者とも解除。次のラウンド終了時まで残ると各自に1D3の雷属性防御無視ダメージを与え、両者とも解除。\u003c/dd>\u003cdt>\u003cb>影縫い状態\u003c/b>\u003c/dt>\u003cdd>回避値-2。付与されたラウンド終了時に解除。\u003c/dd>\u003cdt>\u003cb>嵐痕状態\u003c/b>\u003c/dt>\u003cdd>次の自身の手番終了時、防御行動を行っていれば解除。それ以外は1D3の雷属性防御無視ダメージを受けて解除。通常の列移動では解除せず、重複しない。\u003c/dd>\u003cdt>\u003cb>過負荷駆動状態\u003c/b>\u003c/dt>\u003cdd>準備手番は攻撃判定・ダメージ判定なし。次の自身の手番は行動側で指定された実行技に固定し、実行まで回避値-2。実行時にその技の判定・威力・効果を適用し、解決後に解除。\u003c/dd>\u003cdt>\u003cb>爆裂準備状態\u003c/b>\u003c/dt>\u003cdd>準備手番は攻撃判定・ダメージ判定なし。次の自身の手番は指定技の実行に固定。実行時の命中判定は妨害の影響を受けない。解決後に自身は戦闘不能。準備中に戦闘不能になると不発。\u003c/dd>\u003cdt>\u003cb>鏡像状態\u003c/b>\u003c/dt>\u003cdd>鏡像は最大2体。単体攻撃の対象に選ばれた時、命中判定前に鏡像2体なら1D3、1体なら1D2。出目1は本体へ解決し、それ以外は鏡像1体が消滅して本体には解決しない。複数・1列・全体攻撃では鏡像判定を行わず、本体へ通常どおり解決。\u003c/dd>\u003cdt>\u003cb>踏ん張り状態\u003c/b>\u003c/dt>\u003cdd>強制移動を1回無効にして解除。ダメージや他の効果は受ける。付与時に指定した期限でも解除。\u003c/dd>\u003cdt>\u003cb>弱響状態\u003c/b>\u003c/dt>\u003cdd>次にダメージを与える行動を解決する時、付与時の減少量だけダメージを減らす（最低0）。重複可。その行動の解決時に全スタックを消費。\u003c/dd>\u003cdt>\u003cb>共鳴花粉状態\u003c/b>\u003c/dt>\u003cdd>行動から受ける直接ダメージが付与時の増加量だけ増える。重複は最大2。各スタックはそれぞれ2ラウンドで解除。\u003c/dd>\u003cdt>\u003cb>落果の仕掛け\u003c/b>\u003c/dt>\u003cdd>2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+5&gt;=回避値。成功時に2D6の物属性通常ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。\u003c/dd>\u003cdt>\u003cb>梢の雨\u003c/b>\u003c/dt>\u003cdd>2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+8&gt;=回避値。成功時に2D6+2の物属性通常ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。\u003c/dd>\u003cdt>\u003cb>鳴り残る坑声\u003c/b>\u003c/dt>\u003cdd>2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+8&gt;=回避値。成功時に1D6+1の無属性防御無視ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。\u003c/dd>\u003cdt>\u003cb>坑道の鳴動\u003c/b>\u003c/dt>\u003cdd>2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+11&gt;=回避値。成功時に2D6の無属性防御無視ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。\u003c/dd>\u003c/dl>\n\u003cp>汚染・呪いのI～IIは「1段階下げる」通常解除で治療可能。IIIは「IIIにも使用できる」「段階にかかわらずすべて解除する」など、明記された上位解除のみ使用できる。\u003c/p>\n\u003cp>特定状態への抵抗補正は、その状態の付与に対してのみ適用する。異なる状態は同時に付与できる。\u003c/p>\n","text":"行動に状態名が記載されている場合、効果は共通状態定義を参照する。同名状態は原則として自己重複せず、再付与は残り期間を更新する。段階制状態は各状態の段階ルールに従う。 戦闘用の状態・バフ・デバフ・継続効果は原則として戦闘終了時に解除する。 状態自身に解除条件が定義されている場合、その解除条件を優先する。通常の数値バフ・デバフは、重複不可の指定がなければ累積する。 毒状態 ラウンド終了時に1D3の無属性防御無視ダメージ。戦闘終了後に解除。 汚染 ※汚染I：この戦闘中、受けるHP回復量-2（最低0）。 ※汚染II：この戦闘中、受けるHP回復量-4（最低0）。 ※汚染III：この戦闘中、HP・MPを回復できない。 ※汚染の段階：再度付与された場合は行動に記載された段階数だけ上昇し、最大III。下位段階の効果は加算せず、現在段階の効果だけを適用する。戦闘終了時に解除。 呪い ※呪いI：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-1。 ※呪いII：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-2。 ※呪いIII：この戦闘中、攻撃判定・魔法判定・祈祷判定の達成値-3。 ※呪いの段階：再度付与された場合は行動に記載された段階数だけ上昇し、最大III。下位段階の効果は加算せず、現在段階の効果だけを適用する。戦闘終了時に解除。 鏡蝕状態 攻撃判定・魔法判定・祈祷判定-1。戦闘終了後に解除。 拘束状態 回避値-2。前衛・後衛間を移動できない（通常移動・強制移動とも不可）。次に回避値を参照される攻撃1回の解決後に解除する。 根牢状態 回避値-2。自身の手番に行動1回を消費し、力業判定または細工判定（目標値10）に成功すると解除する。戦闘終了時に解除する。 萎縮状態 攻撃判定・魔法判定・祈祷判定-1。次のラウンド終了時に解除する。 泥まみれ状態 攻撃判定-1、回避値-1。次のラウンド終了時に解除する。 胞子状態 魔法判定・祈祷判定-1、抵抗値-1。次のラウンド終了時に解除する。 侵蝕胞子状態 次のラウンド終了まで魔法判定・祈祷判定-1、抵抗値-1。また、2ラウンドの間、各ラウンド終了時に1D3の無属性防御無視ダメージ。2ラウンド目の終了時に解除。 粘着状態 回避値-2、防御行動値-1。次のラウンド終了時に解除する。 視界不良状態 攻撃判定-1、回避値-1。次のラウンド終了時に解除する。 体勢崩れ状態 常時防御値-1。次のラウンド終了時に解除する。 睡眠状態 覚醒するまで通常移動および行動を行えない。自身の手番開始時に覚醒判定（2D6>=8）を行い、成功すると解除し、その手番は通常どおり行動できる。戦闘終了時にも解除する。 麻痺状態 前衛・後衛間の通常移動不可。強制移動は受ける。攻撃判定・魔法判定・祈祷判定・妨害判定・かばう判定-2。戦闘終了時に解除する。 火傷状態 2ラウンドの間、各ラウンド終了時に1D3の火属性防御無視ダメージ。同じ技・効果の火傷は重複せず、再付与時は残り期間を2ラウンドへ更新。戦闘終了時にも解除。 注目状態 付与された対象は、敵からの単体を対象とする行動の最優先対象となる。複数対象では可能な限り含める。対象条件・射程は変えない。付与時に指定した期限で解除。 注視状態 付与された対象は、この状態を付与した対象を付与されていない仲間より最優先で攻撃する。単体ではその対象を選び、複数対象では可能な限り含める。同じ状態が付与されている味方間での処理順は自由に決めて良い。 威圧状態 この状態を付与した対象を選べる場合、次の手番の行動は防御、またはその対象を含む行動から選ぶ。選べない場合は行動制限なし。その手番終了時に解除。 足止め状態 前衛・後衛間の通常移動不可。強制移動は受ける。次の自身の手番終了時に解除。 移動封鎖状態 前衛・後衛間を移動できない（通常移動・強制移動とも不可）。付与時に指定した期限で解除。 射線遮断状態 敵後衛を対象に含む行動を選べない。敵後衛しか残っていない場合は制限なし。次の自身の手番終了時に解除。 裂傷状態 次に2D6を振る判定を行った直後、1D3+1のHP喪失（防御無視・軽減不可）を受けて解除。判定しなくても次のラウンド終了時に解除。同名効果は重複せず、再付与時は期限を更新。 雷絡状態 命中した最終対象と、同じ列の別PCからランダムに1人を選んで対にする。別PCがいなければ付与しない。どちらかが列移動した時点で両者とも解除。次のラウンド終了時まで残ると各自に1D3の雷属性防御無視ダメージを与え、両者とも解除。 影縫い状態 回避値-2。付与されたラウンド終了時に解除。 嵐痕状態 次の自身の手番終了時、防御行動を行っていれば解除。それ以外は1D3の雷属性防御無視ダメージを受けて解除。通常の列移動では解除せず、重複しない。 過負荷駆動状態 準備手番は攻撃判定・ダメージ判定なし。次の自身の手番は行動側で指定された実行技に固定し、実行まで回避値-2。実行時にその技の判定・威力・効果を適用し、解決後に解除。 爆裂準備状態 準備手番は攻撃判定・ダメージ判定なし。次の自身の手番は指定技の実行に固定。実行時の命中判定は妨害の影響を受けない。解決後に自身は戦闘不能。準備中に戦闘不能になると不発。 鏡像状態 鏡像は最大2体。単体攻撃の対象に選ばれた時、命中判定前に鏡像2体なら1D3、1体なら1D2。出目1は本体へ解決し、それ以外は鏡像1体が消滅して本体には解決しない。複数・1列・全体攻撃では鏡像判定を行わず、本体へ通常どおり解決。 踏ん張り状態 強制移動を1回無効にして解除。ダメージや他の効果は受ける。付与時に指定した期限でも解除。 弱響状態 次にダメージを与える行動を解決する時、付与時の減少量だけダメージを減らす（最低0）。重複可。その行動の解決時に全スタックを消費。 共鳴花粉状態 行動から受ける直接ダメージが付与時の増加量だけ増える。重複は最大2。各スタックはそれぞれ2ラウンドで解除。 落果の仕掛け 2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+5>=回避値。成功時に2D6の物属性通常ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。 梢の雨 2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+8>=回避値。成功時に2D6+2の物属性通常ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。 鳴り残る坑声 2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+8>=回避値。成功時に1D6+1の無属性防御無視ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。 坑道の鳴動 2ラウンド持続。各ラウンド終了時にランダムなPC1人へ2D6+11>=回避値。成功時に2D6の無属性防御無視ダメージ。この判定は妨害の影響を受けない。同名フィールドは重複せず、再設置で残り2ラウンドへ更新。使用者が戦闘不能でも継続。 汚染・呪いのI～IIは「1段階下げる」通常解除で治療可能。IIIは「IIIにも使用できる」「段階にかかわらずすべて解除する」など、明記された上位解除のみ使用できる。 特定状態への抵抗補正は、その状態の付与に対してのみ適用する。異なる状態は同時に付与できる。"},{"key":"player-5","scope":"player","scopeLabel":"プレイヤー","title":"未鑑定スクロール","tags":["魔法","祈祷","鑑定","術式"],"html":"\u003cul>\u003cli>未鑑定スクロールは、未鑑定の魔法スクロールと未鑑定の祈祷スクロールに分ける。\u003c/li>\u003cli>未鑑定の段階で魔法か祈祷か、およびスクロールランクは判別できる。\u003c/li>\u003cli>鑑定結果は、スクロールの種別とランクに一致する候補だけから抽選する。\u003c/li>\u003cli>術式は魔法と祈祷の両方を含む総称なので、鑑定道具の名称は術式鑑定具のままとする。\u003c/li>\u003c/ul>","text":"未鑑定スクロールは、未鑑定の魔法スクロールと未鑑定の祈祷スクロールに分ける。 未鑑定の段階で魔法か祈祷か、およびスクロールランクは判別できる。 鑑定結果は、スクロールの種別とランクに一致する候補だけから抽選する。 術式は魔法と祈祷の両方を含む総称なので、鑑定道具の名称は術式鑑定具のままとする。"},{"key":"player-6","scope":"player","scopeLabel":"プレイヤー","title":"倉庫・所持品・バッグ","tags":["倉庫","所持品","バッグ"],"html":"\u003cul>\u003cli>旧所持品は倉庫。旧携行品は所持品。\u003c/li>\u003cli>倉庫は保管上限なし。スタック数や枠数を気にせず最大限所持できる。\u003c/li>\u003cli>倉庫アイテムは個数0でも登録・保存できる。\u003c/li>\u003cli>冒険中に使用できるのは所持品に入っているアイテムのみ。\u003c/li>\u003cli>バッグは倉庫内アイテムから選択する。\u003c/li>\u003cli>バッグに設定された容量に応じて、キャラシート側の所持品枠数が変化する。\u003c/li>\u003cli>初期バッグは簡素なバッグ。バッグ容量は8。\u003c/li>\u003cli>採取袋は使用しない。袋カテゴリも使用しない。\u003c/li>\u003c/ul>","text":"旧所持品は倉庫。旧携行品は所持品。 倉庫は保管上限なし。スタック数や枠数を気にせず最大限所持できる。 倉庫アイテムは個数0でも登録・保存できる。 冒険中に使用できるのは所持品に入っているアイテムのみ。 バッグは倉庫内アイテムから選択する。 バッグに設定された容量に応じて、キャラシート側の所持品枠数が変化する。 初期バッグは簡素なバッグ。バッグ容量は8。 採取袋は使用しない。袋カテゴリも使用しない。"},{"key":"player-7","scope":"player","scopeLabel":"プレイヤー","title":"キャラクターシート：プリセット","tags":["装備プリセット","所持品プリセット","術式","不足確認"],"html":"\u003cul>\u003cli>装備プリセットは右手・左手・鎧・装飾品と、魔導書・祈祷書・魔印・聖印にセットしている術式をまとめて保存する。\u003c/li>\u003cli>所持品プリセットはバッグ・矢筒・矢筒内の矢弾・冒険へ持ち出す所持品と個数をまとめて保存する。\u003c/li>\u003cli>プリセットの新規登録、現在状態での更新、呼び出しはすべて専用モーダルで確認して実行する。更新モーダルでは名称も変更できる。\u003c/li>\u003cli>呼び出し前に、必要な装備・術式・バッグ・矢筒・アイテム個数・矢弾個数・収納容量を確認する。不足がある場合は「〇〇が不足しています」と不足内容をモーダルへ一覧表示する。\u003c/li>\u003cli>不足があっても呼び出しは禁止しない。確認モーダルで「不足分を除いて呼び出す」を選択すると、用意できる装備・術式・所持品だけを反映し、不足分は未設定または未配置のままにする。\u003c/li>\u003cli>所持品プリセットの不足確認では、現在持ち出している所持品・矢筒内矢弾を倉庫へ戻した場合の総所持数を基準に判定する。\u003c/li>\u003c/ul>","text":"装備プリセットは右手・左手・鎧・装飾品と、魔導書・祈祷書・魔印・聖印にセットしている術式をまとめて保存する。 所持品プリセットはバッグ・矢筒・矢筒内の矢弾・冒険へ持ち出す所持品と個数をまとめて保存する。 プリセットの新規登録、現在状態での更新、呼び出しはすべて専用モーダルで確認して実行する。更新モーダルでは名称も変更できる。 呼び出し前に、必要な装備・術式・バッグ・矢筒・アイテム個数・矢弾個数・収納容量を確認する。不足がある場合は「〇〇が不足しています」と不足内容をモーダルへ一覧表示する。 不足があっても呼び出しは禁止しない。確認モーダルで「不足分を除いて呼び出す」を選択すると、用意できる装備・術式・所持品だけを反映し、不足分は未設定または未配置のままにする。 所持品プリセットの不足確認では、現在持ち出している所持品・矢筒内矢弾を倉庫へ戻した場合の総所持数を基準に判定する。"},{"key":"player-8","scope":"player","scopeLabel":"プレイヤー","title":"作成・道具","tags":["作成","道具"],"html":"\u003cul>\u003cli>調合・細工・鍛冶では対応する道具と素材を使用する。自作では判定を行い、施設依頼では素材と依頼費を支払い、原則として作成判定を行わない。\u003c/li>\u003cli>適正段階より上位の道具を使うと、1段階上ごとに作成難易度-2。下位道具では対応上限を超える作成はできない。\u003c/li>\u003cli>作成補助材は自作時のみ追加消費でき、1個につき作成難易度-2。\u003c/li>\u003c/ul>","text":"調合・細工・鍛冶では対応する道具と素材を使用する。自作では判定を行い、施設依頼では素材と依頼費を支払い、原則として作成判定を行わない。 適正段階より上位の道具を使うと、1段階上ごとに作成難易度-2。下位道具では対応上限を超える作成はできない。 作成補助材は自作時のみ追加消費でき、1個につき作成難易度-2。"},{"key":"player-9","scope":"player","scopeLabel":"プレイヤー","title":"店売り・初期販売","tags":["店売り","初期武器","防具","矢筒"],"html":"\u003cul>\n\u003cli>初期販売武器はショートダガー、ロングソード、ハンドアックス、ウォーハンマー、ショートスピア、ウッドスタッフ、ショートボウ、クロスボウ、ヘヴィクロスボウ、ロングスピア、グレートソード、グレートハンマー。\u003c/li>\n\u003cli>鍛冶屋ではバトルサイズ、アイアンガントレットも購入できる。\u003c/li>\n\u003cli>初期販売防具は旅風のジャケット、鉄紐のベスト、鋲打ちの胴衣、星糸のケープ、祈り布のストール。\u003c/li>\n\u003cli>普段着は0Gの初期装備。矢筒は初期支給されず、鍛冶屋で購入する。\u003c/li>\n\u003c/ul>","text":"初期販売武器はショートダガー、ロングソード、ハンドアックス、ウォーハンマー、ショートスピア、ウッドスタッフ、ショートボウ、クロスボウ、ヘヴィクロスボウ、ロングスピア、グレートソード、グレートハンマー。 鍛冶屋ではバトルサイズ、アイアンガントレットも購入できる。 初期販売防具は旅風のジャケット、鉄紐のベスト、鋲打ちの胴衣、星糸のケープ、祈り布のストール。 普段着は0Gの初期装備。矢筒は初期支給されず、鍛冶屋で購入する。"},{"key":"player-10","scope":"player","scopeLabel":"プレイヤー","title":"矢弾・矢筒","tags":["遠距離武器","矢弾","矢筒","スタック"],"html":"\u003cul>\u003cli>遠距離武器は通常攻撃でも矢弾を1つ消費する。矢弾は実際に発射した時点で消費し、命中・失敗を問わず返還しない。装填だけでは消費しない。\u003c/li>\u003cli>矢弾がない場合、対応する遠距離武器で攻撃できない。弓・クロスボウ・ヘヴィクロスボウ自体には攻撃属性を持たせず、攻撃属性は使用した矢弾で決定する。属性指定のない通常矢弾・状態異常矢弾は物属性とする。武器基礎ダメージと矢弾の加算ダメージは合算し、矢弾属性で処理する。特殊矢弾の非ダメージ効果は命中時のみ発動し、別枠の追加ダメージがある場合は独立したダメージイベントとして防御・属性相性を処理する。\u003c/li>\u003cli>矢弾は種類ごとに管理する。\u003c/li>\u003cli>矢弾は種類ごとに最大スタック数を持つ。\u003c/li>\u003cli>矢弾を矢筒に入れない場合、1種類につき所持品枠を1枠使う。\u003c/li>\u003cli>初期遠距離武器を選んだ場合、対応する通常矢弾を最大スタック数分だけ初期支給する。\u003c/li>\u003cli>通常矢は最大20。通常ボルトは最大20。大型ボルトは最大10。\u003c/li>\u003cli>特殊矢弾の最大スタック数は効果に応じて個別に設定する。クロスボウ・ヘヴィクロスボウは戦闘開始時は装填済み。射撃後の再装填は主行動を1回消費し、装填しただけでは矢弾を消費しない。戦闘終了時に装填済みで未発射の矢弾も消費しない。\u003c/li>\u003cli>矢筒は装備枠『矢筒』に装備する。\u003c/li>\u003cli>矢筒自体は所持品枠を消費しない。\u003c/li>\u003cli>矢筒に入れた矢弾は所持品枠を消費しない。\u003c/li>\u003cli>簡素な矢筒は2種類、旅人の矢筒は3種類、狩人の矢筒は4種類の矢弾を収納できる。\u003c/li>\u003cli>キャラシート側では、矢筒を装備した場合、収納種類数ぶんの矢弾枠を入力する。\u003c/li>\u003c/ul>","text":"遠距離武器は通常攻撃でも矢弾を1つ消費する。矢弾は実際に発射した時点で消費し、命中・失敗を問わず返還しない。装填だけでは消費しない。 矢弾がない場合、対応する遠距離武器で攻撃できない。弓・クロスボウ・ヘヴィクロスボウ自体には攻撃属性を持たせず、攻撃属性は使用した矢弾で決定する。属性指定のない通常矢弾・状態異常矢弾は物属性とする。武器基礎ダメージと矢弾の加算ダメージは合算し、矢弾属性で処理する。特殊矢弾の非ダメージ効果は命中時のみ発動し、別枠の追加ダメージがある場合は独立したダメージイベントとして防御・属性相性を処理する。 矢弾は種類ごとに管理する。 矢弾は種類ごとに最大スタック数を持つ。 矢弾を矢筒に入れない場合、1種類につき所持品枠を1枠使う。 初期遠距離武器を選んだ場合、対応する通常矢弾を最大スタック数分だけ初期支給する。 通常矢は最大20。通常ボルトは最大20。大型ボルトは最大10。 特殊矢弾の最大スタック数は効果に応じて個別に設定する。クロスボウ・ヘヴィクロスボウは戦闘開始時は装填済み。射撃後の再装填は主行動を1回消費し、装填しただけでは矢弾を消費しない。戦闘終了時に装填済みで未発射の矢弾も消費しない。 矢筒は装備枠『矢筒』に装備する。 矢筒自体は所持品枠を消費しない。 矢筒に入れた矢弾は所持品枠を消費しない。 簡素な矢筒は2種類、旅人の矢筒は3種類、狩人の矢筒は4種類の矢弾を収納できる。 キャラシート側では、矢筒を装備した場合、収納種類数ぶんの矢弾枠を入力する。"},{"key":"player-11","scope":"player","scopeLabel":"プレイヤー","title":"クロスボウの2発に1回効果","tags":["クロスボウ","2発に1回","武器効果","攻撃"],"html":"\u003cul>\u003cli>「攻撃2回につき1回」と書かれた武器効果は、同じ武器による偶数回目の攻撃だけに適用する。\u003c/li>\u003cli>1回目の攻撃には適用せず、2回目に適用する。以降も奇数回目は効果なし、偶数回目は効果ありとして交互に処理する。\u003c/li>\u003cli>命中・失敗を問わず、攻撃判定を行った時点でその武器の攻撃回数を1回増やす。\u003c/li>\u003cli>攻撃回数は武器ごとに数え、戦闘終了時にリセットする。\u003c/li>\u003cli>基本の流れは「1発目（効果なし）→2発目（効果あり）→3発目（効果なし）→4発目（効果あり）」とする。\u003c/li>\u003c/ul>","text":"「攻撃2回につき1回」と書かれた武器効果は、同じ武器による偶数回目の攻撃だけに適用する。 1回目の攻撃には適用せず、2回目に適用する。以降も奇数回目は効果なし、偶数回目は効果ありとして交互に処理する。 命中・失敗を問わず、攻撃判定を行った時点でその武器の攻撃回数を1回増やす。 攻撃回数は武器ごとに数え、戦闘終了時にリセットする。 基本の流れは「1発目（効果なし）→2発目（効果あり）→3発目（効果なし）→4発目（効果あり）」とする。"},{"key":"player-12","scope":"player","scopeLabel":"プレイヤー","title":"スキルガチャ・共鳴片","tags":["スキル","共鳴片","重複"],"html":"\u003cul>\u003cli>習得済みのスキルと同じ登録IDをキャラシへ追加した場合、そのスキルは増えず、同じ★ランクの共鳴片へ変換する。\u003c/li>\u003cli>重複1件につき共鳴片を1個獲得し、共鳴片は「特殊素材＞共鳴素材」として倉庫で個数管理する。売却不可。\u003c/li>\u003cli>\u003cb>スキル解放段階：\u003c/b>★1は1-2（近郊の森）解放時、★2は3-2、★3は5-2、★4は7-2、★5は9-2で解放する。★1解放時にはスキルクリスタルも同時に入手する。\u003c/li>\u003cli>\u003cb>スキルクリスタル強化：\u003c/b>★2以降は、その★ランクのスキルが解放される1つ前のエリア解放段階で強化を解放する。★2前＝3-1、★3前＝5-1、★4前＝7-1、★5前＝9-1。\u003c/li>\u003cli>現在排出可能なランクだけをスキルガチャで選択できる。未解放ランクは選択・抽選できない。\u003c/li>\u003c/ul>","text":"習得済みのスキルと同じ登録IDをキャラシへ追加した場合、そのスキルは増えず、同じ★ランクの共鳴片へ変換する。 重複1件につき共鳴片を1個獲得し、共鳴片は「特殊素材＞共鳴素材」として倉庫で個数管理する。売却不可。 スキル解放段階： ★1は1-2（近郊の森）解放時、★2は3-2、★3は5-2、★4は7-2、★5は9-2で解放する。★1解放時にはスキルクリスタルも同時に入手する。 スキルクリスタル強化： ★2以降は、その★ランクのスキルが解放される1つ前のエリア解放段階で強化を解放する。★2前＝3-1、★3前＝5-1、★4前＝7-1、★5前＝9-1。 現在排出可能なランクだけをスキルガチャで選択できる。未解放ランクは選択・抽選できない。"},{"key":"player-13","scope":"player","scopeLabel":"プレイヤー","title":"レシピ・武器派生","tags":["レシピ","派生"],"html":"\u003cul>\u003cli>通常の自作には対応レシピ・必要素材・必要道具・製作判定が必要。通常の加工素材はレシピ不要。\u003c/li>\u003cli>武器上位化は派生元武器と素材を使用して派生する。武器派生にも対応レシピが必要。\u003c/li>\u003cli>施設依頼では必要素材と依頼費を支払い、原則として判定不要。\u003c/li>\u003c/ul>","text":"通常の自作には対応レシピ・必要素材・必要道具・製作判定が必要。通常の加工素材はレシピ不要。 武器上位化は派生元武器と素材を使用して派生する。武器派生にも対応レシピが必要。 施設依頼では必要素材と依頼費を支払い、原則として判定不要。"},{"key":"player-14","scope":"player","scopeLabel":"プレイヤー","title":"装飾品強化","tags":["装飾品","強化"],"html":"\u003cul>\u003cli>装飾品は通常の装備強化枠を持たず、専用の段階強化・派生によって成長する。\u003c/li>\u003cli>装飾品強化では強化元の装飾品1個と必要素材を使用して上位段階へ置き換える。施設依頼は判定不要、自作は細工で判定する。\u003c/li>\u003c/ul>","text":"装飾品は通常の装備強化枠を持たず、専用の段階強化・派生によって成長する。 装飾品強化では強化元の装飾品1個と必要素材を使用して上位段階へ置き換える。施設依頼は判定不要、自作は細工で判定する。"},{"key":"player-15","scope":"player","scopeLabel":"プレイヤー","title":"装備強化","tags":["装備","強化"],"html":"\u003cul>\u003cli>素材強化の対象は武器（魔導書・祈祷書を含む）・鎧・盾。装飾品・バッグ・矢筒・道具・消耗品などは通常の素材強化対象外。\u003c/li>\u003cli>強化回数と強化枠は別に管理する。同じ通常強化は重複可能で、重複した分だけ強化枠を消費する。\u003c/li>\u003cli>強化内容・必要素材・費用・成功率は鍛冶屋の強化画面で確認できる。\u003c/li>\u003c/ul>","text":"素材強化の対象は武器（魔導書・祈祷書を含む）・鎧・盾。装飾品・バッグ・矢筒・道具・消耗品などは通常の素材強化対象外。 強化回数と強化枠は別に管理する。同じ通常強化は重複可能で、重複した分だけ強化枠を消費する。 強化内容・必要素材・費用・成功率は鍛冶屋の強化画面で確認できる。"},{"key":"player-16","scope":"player","scopeLabel":"プレイヤー","title":"戦闘の基本","tags":["戦闘","行動","ダメージ"],"html":"\u003cul>\u003cli>移動は行動権を消費しない。PC・サポートは1ラウンドにつき行動権を1回持ち、ラウンド開始時に行動使用状態を全員リセットする。PC・サポート側の行動順は自由。敵側は先制値の高い順、同値ならシステム内部で割り振った小数点が小さい順に行動する。通常戦闘は敵編成の最大先制値を目標値とする感知判定（イベント指定がある場合はその別判定）で先制を決め、成功時はPC側→敵側、失敗時は敵側→PC側。重要クエスト100%戦闘・エリアボス戦は敵側→PC側で固定する。戦闘開始時に決まった陣営順は戦闘終了まで全ラウンド維持する。ラウンド開始時の複数処理は自由順だが、敵の予定行動公開だけは開始時処理の最後に行う。ラウンド終了時の複数処理は自由順。\u003c/li>\u003cli>通常は自身の手番で移動した後、行動権を消費する行動を1回行う。\u003c/li>\u003cli>攻撃、力業、集中、術式、祈祷、防御、かばう、妨害、鼓舞、解析、道具使用は行動権を消費する。\u003c/li>\u003cli>装備効果だけで追加の攻撃行動や反撃行動を発生させない。\u003c/li>\u003cli>戦闘後処理として、採取やドロップチェックを扱う。\u003c/li>\u003cli>防御と回避は別処理。通常ダメージは「基礎ダメージ→最終防御値による軽減→属性相性」の順で処理する。最終防御値が負ならその絶対値ぶんダメージが増加する。防御で最終ダメージ0になっても命中自体は成立しており、『1点以上のダメージ』など別条件がなければ命中時効果は発生する。\u003c/li>\u003c/ul>","text":"移動は行動権を消費しない。PC・サポートは1ラウンドにつき行動権を1回持ち、ラウンド開始時に行動使用状態を全員リセットする。PC・サポート側の行動順は自由。敵側は先制値の高い順、同値ならシステム内部で割り振った小数点が小さい順に行動する。通常戦闘は敵編成の最大先制値を目標値とする感知判定（イベント指定がある場合はその別判定）で先制を決め、成功時はPC側→敵側、失敗時は敵側→PC側。重要クエスト100%戦闘・エリアボス戦は敵側→PC側で固定する。戦闘開始時に決まった陣営順は戦闘終了まで全ラウンド維持する。ラウンド開始時の複数処理は自由順だが、敵の予定行動公開だけは開始時処理の最後に行う。ラウンド終了時の複数処理は自由順。 通常は自身の手番で移動した後、行動権を消費する行動を1回行う。 攻撃、力業、集中、術式、祈祷、防御、かばう、妨害、鼓舞、解析、道具使用は行動権を消費する。 装備効果だけで追加の攻撃行動や反撃行動を発生させない。 戦闘後処理として、採取やドロップチェックを扱う。 防御と回避は別処理。通常ダメージは「基礎ダメージ→最終防御値による軽減→属性相性」の順で処理する。最終防御値が負ならその絶対値ぶんダメージが増加する。防御で最終ダメージ0になっても命中自体は成立しており、『1点以上のダメージ』など別条件がなければ命中時効果は発生する。"},{"key":"player-17","scope":"player","scopeLabel":"プレイヤー","title":"防御","tags":["防御","防御値","防御行動値","防御技能"],"html":"\u003cul>\u003cli>防御は行動権を消費する。自身の通常手番以外でも使用でき、そのラウンドですでに行動権を使用している場合は使用できない。手番前に防御で行動権を使用した場合、そのラウンドの自身の手番では移動も主行動も行えない。\u003c/li>\u003cli>防御行動中は敵からの攻撃が確実に命中する。\u003c/li>\u003cli>装備の防御行動値ぶん、使用時点から次のラウンド開始時の行動使用状態リセットまで防御値を上昇させる。\u003c/li>\u003cli>防御技能に割り振ったポイントと常時防御値は、防御行動の有無にかかわらずダメージを軽減する。\u003c/li>\u003cli>通常時の最終ダメージは、受けるダメージ－防御技能配分P－常時防御値。\u003c/li>\u003cli>防御行動時の最終ダメージは、受けるダメージ－防御行動値－防御技能配分P－常時防御値。\u003c/li>\u003cli>防御行動そのものに判定は行わない。\u003c/li>\u003cli>最終ダメージは0未満にならない。\u003c/li>\u003c/ul>","text":"防御は行動権を消費する。自身の通常手番以外でも使用でき、そのラウンドですでに行動権を使用している場合は使用できない。手番前に防御で行動権を使用した場合、そのラウンドの自身の手番では移動も主行動も行えない。 防御行動中は敵からの攻撃が確実に命中する。 装備の防御行動値ぶん、使用時点から次のラウンド開始時の行動使用状態リセットまで防御値を上昇させる。 防御技能に割り振ったポイントと常時防御値は、防御行動の有無にかかわらずダメージを軽減する。 通常時の最終ダメージは、受けるダメージ－防御技能配分P－常時防御値。 防御行動時の最終ダメージは、受けるダメージ－防御行動値－防御技能配分P－常時防御値。 防御行動そのものに判定は行わない。 最終ダメージは0未満にならない。"},{"key":"player-18","scope":"player","scopeLabel":"プレイヤー","title":"かばう","tags":["かばう","防御技能","先制値"],"html":"\u003cul>\u003cli>かばうは行動権を消費し、味方への攻撃1回に割り込んで自分が引き受ける。自身の通常手番以外でも使用できるが、そのラウンドですでに行動権を使用している場合は使用できない。\u003c/li>\u003cli>処理順は「敵の攻撃対象を決定 → かばう判定 → 成功時に防御行動値を次のその攻撃の間だけ追加 → 敵の攻撃判定を行わずダメージ算出 → 防御による軽減を適用」の順。\u003c/li>\u003cli>かばう判定は2D6＋防御技能 &gt;= その攻撃を行う敵の先制値。同じエリアの味方は補正なし、異なるエリアの味方をかばう場合は判定-2。\u003c/li>\u003cli>成功した場合は攻撃対象を自分へ変更し、その敵の攻撃判定は行わない。かばったPCが攻撃を受けるものとしてダメージだけを算出する。\u003c/li>\u003cli>成功時は防御行動値を含めた最終防御値でその攻撃を処理する。防御値半分無視・固定値無視などの防御無視は、基礎防御・防御技能配分P・防御行動値・状態やバフ／デバフによる補正を反映した最終防御値に対して適用する。最終防御値が負の場合、防御無視は作用せず、その負値ぶん受けるダメージが増加する。\u003c/li>\u003cli>1回のかばうで引き受けられるのは、敵1体が行う1回の攻撃に含まれる味方1人分まで。多段攻撃に対するかばう判定は最初の1回だけ行い、成功した場合はその攻撃終了まで同じ対象を継続してかばえる。かばう側が途中で戦闘不能になった場合、残りの段は元の対象へ戻る。\u003c/li>\u003cli>前列のみ／後列のみを対象とする範囲攻撃は、その範囲内の味方1人分だけかばえる。前列・後列の両方を対象とする全体攻撃はかばえない。\u003c/li>\u003cli>低命中・高威力攻撃をかばうと敵の攻撃判定を飛ばすため、本来は回避で外れた可能性も失う。危険行動だから常にかばうのが正解とは限らない。\u003c/li>\u003c/ul>","text":"かばうは行動権を消費し、味方への攻撃1回に割り込んで自分が引き受ける。自身の通常手番以外でも使用できるが、そのラウンドですでに行動権を使用している場合は使用できない。 処理順は「敵の攻撃対象を決定 → かばう判定 → 成功時に防御行動値を次のその攻撃の間だけ追加 → 敵の攻撃判定を行わずダメージ算出 → 防御による軽減を適用」の順。 かばう判定は2D6＋防御技能 >= その攻撃を行う敵の先制値。同じエリアの味方は補正なし、異なるエリアの味方をかばう場合は判定-2。 成功した場合は攻撃対象を自分へ変更し、その敵の攻撃判定は行わない。かばったPCが攻撃を受けるものとしてダメージだけを算出する。 成功時は防御行動値を含めた最終防御値でその攻撃を処理する。防御値半分無視・固定値無視などの防御無視は、基礎防御・防御技能配分P・防御行動値・状態やバフ／デバフによる補正を反映した最終防御値に対して適用する。最終防御値が負の場合、防御無視は作用せず、その負値ぶん受けるダメージが増加する。 1回のかばうで引き受けられるのは、敵1体が行う1回の攻撃に含まれる味方1人分まで。多段攻撃に対するかばう判定は最初の1回だけ行い、成功した場合はその攻撃終了まで同じ対象を継続してかばえる。かばう側が途中で戦闘不能になった場合、残りの段は元の対象へ戻る。 前列のみ／後列のみを対象とする範囲攻撃は、その範囲内の味方1人分だけかばえる。前列・後列の両方を対象とする全体攻撃はかばえない。 低命中・高威力攻撃をかばうと敵の攻撃判定を飛ばすため、本来は回避で外れた可能性も失う。危険行動だから常にかばうのが正解とは限らない。"},{"key":"player-19","scope":"player","scopeLabel":"プレイヤー","title":"妨害","tags":["妨害","先制値","判定補正"],"html":"\u003cul>\u003cli>妨害は行動権を消費する。自身の通常手番以外でも使用できるが、そのラウンドですでに行動権を使用している場合は使用できない。\u003c/li>\u003cli>提案内容に応じて対応技能と適用エリアを決める。\u003c/li>\u003cli>判定は2D6＋対応技能値 &gt;= 敵の先制値。\u003c/li>\u003cli>成功すると、対象が次に関与する判定1回について、その対象側の参照値-2。対象自身が行う判定だけでなく、その対象の回避値・抵抗値などが参照される判定にも適用する。敵側では術式・祈祷・妨害などの分類を用いず、すべて「判定」として扱う。\u003c/li>\u003cli>能動・受動を問わず、その対象が次に関与した判定1回で消費する。\u003c/li>\u003c/ul>","text":"妨害は行動権を消費する。自身の通常手番以外でも使用できるが、そのラウンドですでに行動権を使用している場合は使用できない。 提案内容に応じて対応技能と適用エリアを決める。 判定は2D6＋対応技能値 >= 敵の先制値。 成功すると、対象が次に関与する判定1回について、その対象側の参照値-2。対象自身が行う判定だけでなく、その対象の回避値・抵抗値などが参照される判定にも適用する。敵側では術式・祈祷・妨害などの分類を用いず、すべて「判定」として扱う。 能動・受動を問わず、その対象が次に関与した判定1回で消費する。"},{"key":"player-20","scope":"player","scopeLabel":"プレイヤー","title":"武器攻撃・力業攻撃・集中攻撃","tags":["武器攻撃","力業","集中","近接","射撃","魔法"],"html":"\u003cul>\u003cli>攻撃判定は2D6＋使用技能値 &gt;= 対象の回避値。成功するとダメージが発生する。\u003c/li>\u003cli>近接武器は前衛の敵だけを攻撃できる。\u003c/li>\u003cli>武器の使用技能は、近接武器＝近接、弓・クロスボウ・ヘヴィクロスボウ＝射撃、魔導書＝魔法、祈祷書＝祈祷として固定する。武器作成・武器派生・武器強化の製作判定には細工を使用する。設計は現状、罠の作成・調整にのみ使用する。\u003c/li>\u003cli>遠距離武器は後衛も攻撃できるが、敵前衛がいる状態で後衛を狙う場合は判定-2。\u003c/li>\u003cli>魔法は前衛・後衛を同じ条件で対象にできる。\u003c/li>\u003cli>ダメージには本来使用する技能へ割り振ったポイント分の固定値を加算する。\u003c/li>\u003cli>武器ダメージ1D6+1、近接配分P+2なら、成功時ダメージは1D6+3。\u003c/li>\u003cli>力業攻撃は近接攻撃時に近接の代わりに力業で攻撃判定を行う。\u003c/li>\u003cli>力業攻撃に成功した場合、武器ダメージのダイスを+1個し、対象の最終防御値の半分に相当する量（端数切り上げ）を無視する。\u003c/li>\u003cli>力業攻撃の防御半分無視は、基礎防御・防御技能配分P・防御行動値・状態やバフ／デバフによる補正を反映した最終防御値に対して適用する。属性耐性や、防御値とは別に記載された個別軽減は無視しない。\u003c/li>\u003cli>力業攻撃の固定値は近接に割り振ったポイントを参照する。\u003c/li>\u003cli>力業攻撃を行った場合、成否にかかわらず、次の自分のターンは移動を含む一切の行動ができない。\u003c/li>\u003cli>常時防御値-2は、力業攻撃を行った直後から行動不能ターンの終了時まで適用する。その次の自分のターンから通常どおり行動できる。\u003c/li>\u003cli>集中は主行動を使用して集中状態になる。移動は通常どおり別処理で行える。\u003c/li>\u003cli>集中開始後から次の自分のターン開始までに1点以上のダメージを受けた場合、集中状態を解除する。防御などで最終ダメージが0なら解除しない。\u003c/li>\u003cli>集中状態を維持したまま次の自分のターンを迎えた場合、射撃武器による攻撃またはダメージを与える魔法を1回行える。\u003c/li>\u003cli>集中攻撃では、本来の射撃または魔法の代わりに集中技能を使用して判定し、その判定に+2する。元の攻撃が参照する回避値・抵抗値などの目標値は変更しない。\u003c/li>\u003cli>集中攻撃のダメージは、本来の射撃または魔法へ割り振ったポイントを参照し、通常のダメージにダメージダイスを+1個する。集中へ割り振ったポイントをダメージへ加えるわけではない。\u003c/li>\u003cli>集中攻撃は単体・複数・列・範囲を問わず使用できる。複数対象では各対象への判定とダメージを通常どおり個別に行い、命中した各対象の直接ダメージへダメージダイス+1個を適用する。\u003c/li>\u003cli>射撃武器で敵前衛がいる状態から後衛を狙う場合の判定-2は集中攻撃でも適用する。集中の+2と相殺できる。\u003c/li>\u003cli>集中攻撃の矢弾・MPなどの消費は、その攻撃・魔法1回分のみ。攻撃後は成否にかかわらず集中状態を解除する。\u003c/li>\u003cli>集中攻撃は祈祷には使用できない。\u003c/li>\u003c/ul>","text":"攻撃判定は2D6＋使用技能値 >= 対象の回避値。成功するとダメージが発生する。 近接武器は前衛の敵だけを攻撃できる。 武器の使用技能は、近接武器＝近接、弓・クロスボウ・ヘヴィクロスボウ＝射撃、魔導書＝魔法、祈祷書＝祈祷として固定する。武器作成・武器派生・武器強化の製作判定には細工を使用する。設計は現状、罠の作成・調整にのみ使用する。 遠距離武器は後衛も攻撃できるが、敵前衛がいる状態で後衛を狙う場合は判定-2。 魔法は前衛・後衛を同じ条件で対象にできる。 ダメージには本来使用する技能へ割り振ったポイント分の固定値を加算する。 武器ダメージ1D6+1、近接配分P+2なら、成功時ダメージは1D6+3。 力業攻撃は近接攻撃時に近接の代わりに力業で攻撃判定を行う。 力業攻撃に成功した場合、武器ダメージのダイスを+1個し、対象の最終防御値の半分に相当する量（端数切り上げ）を無視する。 力業攻撃の防御半分無視は、基礎防御・防御技能配分P・防御行動値・状態やバフ／デバフによる補正を反映した最終防御値に対して適用する。属性耐性や、防御値とは別に記載された個別軽減は無視しない。 力業攻撃の固定値は近接に割り振ったポイントを参照する。 力業攻撃を行った場合、成否にかかわらず、次の自分のターンは移動を含む一切の行動ができない。 常時防御値-2は、力業攻撃を行った直後から行動不能ターンの終了時まで適用する。その次の自分のターンから通常どおり行動できる。 集中は主行動を使用して集中状態になる。移動は通常どおり別処理で行える。 集中開始後から次の自分のターン開始までに1点以上のダメージを受けた場合、集中状態を解除する。防御などで最終ダメージが0なら解除しない。 集中状態を維持したまま次の自分のターンを迎えた場合、射撃武器による攻撃またはダメージを与える魔法を1回行える。 集中攻撃では、本来の射撃または魔法の代わりに集中技能を使用して判定し、その判定に+2する。元の攻撃が参照する回避値・抵抗値などの目標値は変更しない。 集中攻撃のダメージは、本来の射撃または魔法へ割り振ったポイントを参照し、通常のダメージにダメージダイスを+1個する。集中へ割り振ったポイントをダメージへ加えるわけではない。 集中攻撃は単体・複数・列・範囲を問わず使用できる。複数対象では各対象への判定とダメージを通常どおり個別に行い、命中した各対象の直接ダメージへダメージダイス+1個を適用する。 射撃武器で敵前衛がいる状態から後衛を狙う場合の判定-2は集中攻撃でも適用する。集中の+2と相殺できる。 集中攻撃の矢弾・MPなどの消費は、その攻撃・魔法1回分のみ。攻撃後は成否にかかわらず集中状態を解除する。 集中攻撃は祈祷には使用できない。"},{"key":"player-21","scope":"player","scopeLabel":"プレイヤー","title":"術式・祈祷","tags":["術式","祈祷","属性","防御判定"],"html":"\u003cul>\u003cli>初期魔法術式は魔力弾のみ。\u003c/li>\u003cli>初期祈祷は癒しの祈りのみ。\u003c/li>\u003cli>初期魔法術式と初期祈祷は全員が取得する。\u003c/li>\u003cli>術式と祈祷には属性を設定する。\u003c/li>\u003cli>魔導書のセット術式枠は、1＋魔法への振り分けポイント＋装備固有の術式枠補正＋強化による術式枠補正。\u003c/li>\u003cli>祈祷書のセット術式枠は、1＋祈祷への振り分けポイント＋装備固有の術式枠補正＋強化による術式枠補正。\u003c/li>\u003cli>セット術式とセット祈祷は、所持している術式データから選択する。\u003c/li>\u003cli>火球、氷槍、雷撃、光弾、闇弾、爆発範囲などの攻撃・投射・範囲系魔法は回避で防ぐ。\u003c/li>\u003cli>毒・汚染・呪い・麻痺・睡眠などの身体・精神・状態異常系効果は抵抗で防ぐ。\u003c/li>\u003cli>魔物行動も同じ基準とし、攻撃・投射・範囲攻撃は回避、身体・精神・状態異常系効果は抵抗を達成値にする。\u003c/li>\u003cli>抵抗値を参照する魔物行動は、魔物側がその行動に設定された基礎技能値で判定し、PCの抵抗値以上なら効果を適用する。PC側は抵抗判定を行わない。敵側の行動では術式・祈祷・妨害などのPC側分類を用いず、すべて行動ごとの「判定」として扱う。\u003c/li>\u003cli>探索・環境処理などでPCが自分から行う回避判定・抵抗判定は、2D6＋対応する技能合計（装備の回避補正・抵抗補正込み）で行い、+5は加えない。戦闘中、敵攻撃に対してPCが能動的な回避判定を行うことはなく、敵側の判定がPCの回避値を参照する。敵の行動から参照される回避値・抵抗値は、その技能合計に+5し、回避値・抵抗値専用補正があればさらに加算する。\u003c/li>\u003cli>PCには先制値を設定しない。先制値は魔物側の妨害・かばう・逃亡などで参照する値として扱う。\u003c/li>\u003c/ul>","text":"初期魔法術式は魔力弾のみ。 初期祈祷は癒しの祈りのみ。 初期魔法術式と初期祈祷は全員が取得する。 術式と祈祷には属性を設定する。 魔導書のセット術式枠は、1＋魔法への振り分けポイント＋装備固有の術式枠補正＋強化による術式枠補正。 祈祷書のセット術式枠は、1＋祈祷への振り分けポイント＋装備固有の術式枠補正＋強化による術式枠補正。 セット術式とセット祈祷は、所持している術式データから選択する。 火球、氷槍、雷撃、光弾、闇弾、爆発範囲などの攻撃・投射・範囲系魔法は回避で防ぐ。 毒・汚染・呪い・麻痺・睡眠などの身体・精神・状態異常系効果は抵抗で防ぐ。 魔物行動も同じ基準とし、攻撃・投射・範囲攻撃は回避、身体・精神・状態異常系効果は抵抗を達成値にする。 抵抗値を参照する魔物行動は、魔物側がその行動に設定された基礎技能値で判定し、PCの抵抗値以上なら効果を適用する。PC側は抵抗判定を行わない。敵側の行動では術式・祈祷・妨害などのPC側分類を用いず、すべて行動ごとの「判定」として扱う。 探索・環境処理などでPCが自分から行う回避判定・抵抗判定は、2D6＋対応する技能合計（装備の回避補正・抵抗補正込み）で行い、+5は加えない。戦闘中、敵攻撃に対してPCが能動的な回避判定を行うことはなく、敵側の判定がPCの回避値を参照する。敵の行動から参照される回避値・抵抗値は、その技能合計に+5し、回避値・抵抗値専用補正があればさらに加算する。 PCには先制値を設定しない。先制値は魔物側の妨害・かばう・逃亡などで参照する値として扱う。"},{"key":"player-22","scope":"player","scopeLabel":"プレイヤー","title":"技能の戦闘利用","tags":["採取","知識","鼓舞","魅力"],"html":"\u003cul>\u003cli>採取は、魔物撃破後の採取判定に成功するとドロップチェックに+1する。\u003c/li>\u003cli>知識カテゴリは魔物、素材、属性。\u003c/li>\u003cli>解析は敵の属性を1つ指定し、2D6＋知識技能 &gt;= 対象の抵抗値で判定する。\u003c/li>\u003cli>解析成功時、指定した属性の相性（通常・弱点・耐性・無効・吸収・反射）を完全に看破する。判明した属性相性は魔物種単位で共有・記録し、以後は既知として扱う。\u003c/li>\u003cli>鼓舞はターンを消費し、2D6＋鼓舞技能 &gt;= 10で判定する。\u003c/li>\u003cli>鼓舞成功時、対象の次の判定+2。\u003c/li>\u003cli>逃走は、パーティーの運動技能合計が敵全体の先制値合計以上なら判定なしで成功する。運動技能合計が不足している場合も、1ラウンドにつきパーティーで1回まで「2D6＋パーティーの運動技能合計 &gt;= 敵全体の先制値合計＋6」で逃走判定を行える。成功すれば逃走し、失敗しても追加攻撃などは発生せず、そのまま戦闘を続行する。敵を倒して先制値合計が下がれば必要出目も下がり、運動技能合計以上まで下がれば判定なしの逃走へ移行する。\u003c/li>\u003c/ul>","text":"採取は、魔物撃破後の採取判定に成功するとドロップチェックに+1する。 知識カテゴリは魔物、素材、属性。 解析は敵の属性を1つ指定し、2D6＋知識技能 >= 対象の抵抗値で判定する。 解析成功時、指定した属性の相性（通常・弱点・耐性・無効・吸収・反射）を完全に看破する。判明した属性相性は魔物種単位で共有・記録し、以後は既知として扱う。 鼓舞はターンを消費し、2D6＋鼓舞技能 >= 10で判定する。 鼓舞成功時、対象の次の判定+2。 逃走は、パーティーの運動技能合計が敵全体の先制値合計以上なら判定なしで成功する。運動技能合計が不足している場合も、1ラウンドにつきパーティーで1回まで「2D6＋パーティーの運動技能合計 >= 敵全体の先制値合計＋6」で逃走判定を行える。成功すれば逃走し、失敗しても追加攻撃などは発生せず、そのまま戦闘を続行する。敵を倒して先制値合計が下がれば必要出目も下がり、運動技能合計以上まで下がれば判定なしの逃走へ移行する。"},{"key":"player-23","scope":"player","scopeLabel":"プレイヤー","title":"判定式","tags":["判定","対抗","カスタムチェック"],"html":"\u003cul>\u003cli>対抗式の表記は『○○vs○○』ではなく『○○&gt;=○○』に統一する。2D6を使用する判定は共通して、出目6・6なら技能値・達成値・補正に関係なくクリティカルとして自動成功、出目1・1ならファンブルとして自動失敗する。クリティカル／ファンブルに追加効果はない。\u003c/li>\u003cli>左側はカテゴリに合う技能を使う。\u003c/li>\u003cli>右側は任意入力、または選択肢から設定する。\u003c/li>\u003cli>非術式系のチェックも、必要なものは同じ形式に統一する。\u003c/li>\u003cli>カスタムチェックは保存と読込を可能にする。\u003c/li>\u003c/ul>","text":"対抗式の表記は『○○vs○○』ではなく『○○>=○○』に統一する。2D6を使用する判定は共通して、出目6・6なら技能値・達成値・補正に関係なくクリティカルとして自動成功、出目1・1ならファンブルとして自動失敗する。クリティカル／ファンブルに追加効果はない。 左側はカテゴリに合う技能を使う。 右側は任意入力、または選択肢から設定する。 非術式系のチェックも、必要なものは同じ形式に統一する。 カスタムチェックは保存と読込を可能にする。"},{"key":"player-24","scope":"player","scopeLabel":"プレイヤー","title":"属性・複合属性・属性開示","tags":["属性","二刀流","解析","弱点","反射"],"html":"\u003cul>\n\u003cli>属性は物・火・水・風・雷・光・闇・無の8種類。無属性も他属性と同様に通常・弱点・耐性・無効・吸収・反射を持ち得る。\u003c/li>\n\u003cli>通常ダメージは防御処理後に属性相性を適用する。弱点は2倍、耐性は半減して端数切り上げ、無効は0、吸収は受けるはずだったダメージ分だけHP回復（最大HPまで）、反射は受けるはずだったダメージを攻撃者へ防御無視で返す。\u003c/li>\n\u003cli>本体攻撃が無効・吸収された場合、その本体攻撃に付随する命中時効果は発生しない。反射された場合は本体攻撃の命中時効果も攻撃者側へ反射する。防御処理で0になっただけなら命中自体は成立しているため、別条件がなければ命中時効果は発生する。\u003c/li>\n\u003cli>近接二刀流の複合属性は、主手の通常ダメージ＋副手攻撃値を合算してから防御を1回だけ適用し、その後に含まれる属性相性の優先度を判定する。優先度は「通常＜弱点＜耐性＜無効＜吸収＜反射」。主手・副手が同属性なら合算して単一属性として扱う。副手武器自身の武器効果は発動しない。遠距離武器には副手攻撃値を使用しない。\u003c/li>\n\u003cli>解析は属性を1つ指定し、2D6＋知識技能&gt;=対象の抵抗値。成功するとその属性の相性を完全に開示する。実際の攻撃でも、命中して属性相性処理へ到達し、その相性がダメージ処理へ関与した時点で開示される。防御だけで0になり属性相性処理へ到達しなかった場合は開示しない。\u003c/li>\n\u003cli>判明した属性相性は魔物種単位で共有・記録する。同種の二つ名・後のエリアで再登場した同種にも既知情報を引き継ぐ。エリアボスは固有相性として別管理する。\u003c/li>\n\u003c/ul>","text":"属性は物・火・水・風・雷・光・闇・無の8種類。無属性も他属性と同様に通常・弱点・耐性・無効・吸収・反射を持ち得る。 通常ダメージは防御処理後に属性相性を適用する。弱点は2倍、耐性は半減して端数切り上げ、無効は0、吸収は受けるはずだったダメージ分だけHP回復（最大HPまで）、反射は受けるはずだったダメージを攻撃者へ防御無視で返す。 本体攻撃が無効・吸収された場合、その本体攻撃に付随する命中時効果は発生しない。反射された場合は本体攻撃の命中時効果も攻撃者側へ反射する。防御処理で0になっただけなら命中自体は成立しているため、別条件がなければ命中時効果は発生する。 近接二刀流の複合属性は、主手の通常ダメージ＋副手攻撃値を合算してから防御を1回だけ適用し、その後に含まれる属性相性の優先度を判定する。優先度は「通常＜弱点＜耐性＜無効＜吸収＜反射」。主手・副手が同属性なら合算して単一属性として扱う。副手武器自身の武器効果は発動しない。遠距離武器には副手攻撃値を使用しない。 解析は属性を1つ指定し、2D6＋知識技能>=対象の抵抗値。成功するとその属性の相性を完全に開示する。実際の攻撃でも、命中して属性相性処理へ到達し、その相性がダメージ処理へ関与した時点で開示される。防御だけで0になり属性相性処理へ到達しなかった場合は開示しない。 判明した属性相性は魔物種単位で共有・記録する。同種の二つ名・後のエリアで再登場した同種にも既知情報を引き継ぐ。エリアボスは固有相性として別管理する。"},{"key":"player-25","scope":"player","scopeLabel":"プレイヤー","title":"撤退・失敗・強制帰還","tags":["撤退","失敗","帰還"],"html":"\u003cul>\u003cli>通常のエリア探索は途中で任意に終了して拠点へ戻れる。途中帰還そのものに所持金・アイテム喪失などの追加ペナルティはない。\u003c/li>\u003cli>途中帰還しても、その探索中にすでに獲得した通常のアイテム・素材は保持する。ただし探索進行度は破棄され、次回の探索は0%から開始する。\u003c/li>\u003cli>未完了のクエストから撤退した場合、そのクエスト挑戦は終了し、進行度を破棄する。クエスト報酬・達成報酬は得られない。次回挑戦時は0%から開始する。\u003c/li>\u003cli>クエスト固有の失敗条件を満たした場合も、その挑戦は失敗として終了する。失敗だけを理由に所持金・通常獲得アイテムを失うことはなく、個別の失敗効果が記載されている場合だけそれを適用する。\u003c/li>\u003cli>PC全員が戦闘不能になった場合は全滅となり、通常の撤退・クエスト失敗とは別に全滅ペナルティを適用する。\u003c/li>\u003cli>サポートだけが行動可能で、サポート以外のPCが全員戦闘不能になった場合は自動帰還。全滅ではないため全滅ペナルティはない。\u003c/li>\u003cli>戦闘から逃走しただけでは探索そのものは終了しない。逃走した戦闘の報酬だけを失い、その後に探索を続けるか帰還するかを選べる。\u003c/li>\u003c/ul>","text":"通常のエリア探索は途中で任意に終了して拠点へ戻れる。途中帰還そのものに所持金・アイテム喪失などの追加ペナルティはない。 途中帰還しても、その探索中にすでに獲得した通常のアイテム・素材は保持する。ただし探索進行度は破棄され、次回の探索は0%から開始する。 未完了のクエストから撤退した場合、そのクエスト挑戦は終了し、進行度を破棄する。クエスト報酬・達成報酬は得られない。次回挑戦時は0%から開始する。 クエスト固有の失敗条件を満たした場合も、その挑戦は失敗として終了する。失敗だけを理由に所持金・通常獲得アイテムを失うことはなく、個別の失敗効果が記載されている場合だけそれを適用する。 PC全員が戦闘不能になった場合は全滅となり、通常の撤退・クエスト失敗とは別に全滅ペナルティを適用する。 サポートだけが行動可能で、サポート以外のPCが全員戦闘不能になった場合は自動帰還。全滅ではないため全滅ペナルティはない。 戦闘から逃走しただけでは探索そのものは終了しない。逃走した戦闘の報酬だけを失い、その後に探索を続けるか帰還するかを選べる。"},{"key":"player-26","scope":"player","scopeLabel":"プレイヤー","title":"戦闘不能・全滅","tags":["HP0","戦闘不能","全滅","帰還"],"html":"\u003cul>\n\u003cli>HPが0以下になった時点で即座に戦闘不能。HPは0未満を記録せず0に固定する。\u003c/li>\n\u003cli>戦闘不能者は敵の対象候補から外れ、その時点で状態・バフ・デバフ・継続効果を解除する。通常の回復・道具では戦闘不能から復帰できず、専用の蘇生効果だけが復帰を可能にする。\u003c/li>\n\u003cli>戦闘不能中は後続戦闘へ参加できず、探索・イベント・採取等の技能判定にも参加できない。そのキャラクターの所持品や装備効果を他PCが借りて使用することもできない。サポートも同様。\u003c/li>\n\u003cli>同じタイミングで複数がHP0になった場合は同時に戦闘不能とする。「戦闘不能になる時」「HP0になる時」などへ介入する複数効果がある場合、その処理順は使用者側が自由に決める。\u003c/li>\n\u003cli>PC全員が戦闘不能すると全滅。拠点へ強制帰還し、クエスト中ならクエスト失敗。帰還時は全員HP1・MP1。現在所持金の25%（端数切り上げ）と、その探索・クエスト中に新規獲得した全アイテムの50%（端数切り上げ）を失う。新規獲得物の損失はアイテム1個単位でランダム判定し、探索開始前から所持していた物は対象外。\u003c/li>\n\u003cli>一部PCが戦闘不能でも残存PCが勝利すれば通常の勝利報酬を得られ、戦闘不能者も報酬対象に含む。サポート同行時にサポート以外のPC全員が戦闘不能しサポートだけが残った場合は自動帰還するが、全滅扱いではなく全滅ペナルティを適用しない。\u003c/li>\n\u003c/ul>","text":"HPが0以下になった時点で即座に戦闘不能。HPは0未満を記録せず0に固定する。 戦闘不能者は敵の対象候補から外れ、その時点で状態・バフ・デバフ・継続効果を解除する。通常の回復・道具では戦闘不能から復帰できず、専用の蘇生効果だけが復帰を可能にする。 戦闘不能中は後続戦闘へ参加できず、探索・イベント・採取等の技能判定にも参加できない。そのキャラクターの所持品や装備効果を他PCが借りて使用することもできない。サポートも同様。 同じタイミングで複数がHP0になった場合は同時に戦闘不能とする。「戦闘不能になる時」「HP0になる時」などへ介入する複数効果がある場合、その処理順は使用者側が自由に決める。 PC全員が戦闘不能すると全滅。拠点へ強制帰還し、クエスト中ならクエスト失敗。帰還時は全員HP1・MP1。現在所持金の25%（端数切り上げ）と、その探索・クエスト中に新規獲得した全アイテムの50%（端数切り上げ）を失う。新規獲得物の損失はアイテム1個単位でランダム判定し、探索開始前から所持していた物は対象外。 一部PCが戦闘不能でも残存PCが勝利すれば通常の勝利報酬を得られ、戦闘不能者も報酬対象に含む。サポート同行時にサポート以外のPC全員が戦闘不能しサポートだけが残った場合は自動帰還するが、全滅扱いではなく全滅ペナルティを適用しない。"},{"key":"player-27","scope":"player","scopeLabel":"プレイヤー","title":"逃走","tags":["逃走","運動","先制値"],"html":"\u003cul>\n\u003cli>逃走は主行動ではなく、PC陣営の行動中にパーティー単位で行う独立処理。1ラウンドにつきパーティー全体で1回までで、逃走を試みたラウンドでも各PC・サポートは通常どおり行動できる。\u003c/li>\n\u003cli>パーティーの運動技能合計&gt;=生存している敵全体の先制値合計なら判定なしで成功。\u003c/li>\n\u003cli>不足時は2D6＋パーティーの運動技能合計&gt;=敵全体の先制値合計＋6で判定し、成功で即戦闘終了。失敗しても追加ペナルティはない。\u003c/li>\n\u003cli>逃走成功時、その戦闘の報酬はすべて失う。逃走前にすでに倒していた敵の報酬も獲得できない。\u003c/li>\n\u003cli>エリアボス戦および逃走不可と定められた固定クエスト戦闘では逃走できない。\u003c/li>\n\u003c/ul>","text":"逃走は主行動ではなく、PC陣営の行動中にパーティー単位で行う独立処理。1ラウンドにつきパーティー全体で1回までで、逃走を試みたラウンドでも各PC・サポートは通常どおり行動できる。 パーティーの運動技能合計>=生存している敵全体の先制値合計なら判定なしで成功。 不足時は2D6＋パーティーの運動技能合計>=敵全体の先制値合計＋6で判定し、成功で即戦闘終了。失敗しても追加ペナルティはない。 逃走成功時、その戦闘の報酬はすべて失う。逃走前にすでに倒していた敵の報酬も獲得できない。 エリアボス戦および逃走不可と定められた固定クエスト戦闘では逃走できない。"},{"key":"player-28","scope":"player","scopeLabel":"プレイヤー","title":"初期矢弾","tags":["初期所持品","矢弾","所持品"],"html":"\u003cul>\u003cli>初期武器の選択に関係なく、通常矢、通常ボルト、大型ボルトをそれぞれ1スタック分、初期所持品に入れる。\u003c/li>\u003cli>通常矢と通常ボルトは20個、大型ボルトは10個を1スタックとする。\u003c/li>\u003cli>矢筒は初期支給しない。矢弾は所持品枠を使用する。\u003c/li>\u003c/ul>","text":"初期武器の選択に関係なく、通常矢、通常ボルト、大型ボルトをそれぞれ1スタック分、初期所持品に入れる。 通常矢と通常ボルトは20個、大型ボルトは10個を1スタックとする。 矢筒は初期支給しない。矢弾は所持品枠を使用する。"},{"key":"gm-0","scope":"gm","scopeLabel":"GM","title":"エリア探索の進行手順","tags":["GM","探索","進行度"],"html":"\u003cul>\u003cli>探索開始時にその日の行動回数を1回消費し、探索進行度を0%へ初期化する。開始できる行動回数が残っていない場合は探索を開始しない。\u003c/li>\u003cli>各進行地点では「イベント解決→進行度上昇」の順。進行度だけ先に進めない。0%と100%もイベント処理対象。\u003c/li>\u003cli>進行上昇値はエリアデータのprogressStepを使用する。開拓拠点は25%。通常エリアは各エリア設定に従う。\u003c/li>\u003cli>固定イベントがない地点では、そのエリアのランダムイベント表から抽選する。同一探索内で既出の通常イベントは候補から除く。\u003c/li>\u003cli>通常エリアのイベント抽選・魔物遭遇には、その日の天気、現在の時間帯、有効な噂を反映する。異界には天気・時間帯を適用しない。\u003c/li>\u003cli>戦闘が発生したら戦闘を最後まで処理し、必要な採取・ドロップ処理を済ませてからその進行地点を解決済みにする。\u003c/li>\u003cli>隠しエリア入口イベントが成立した場合、侵入を選ぶと追加で1行動消費。隠し探索の状態は元探索とは分離し、終了後に元探索の状態へ復帰する。\u003c/li>\u003cli>途中帰還ではその探索セッションを終了する。次回探索は0%から開始する。\u003c/li>\u003cli>100%地点のイベント解決後、その探索を完了として終了する。\u003c/li>\u003c/ul>","text":"探索開始時にその日の行動回数を1回消費し、探索進行度を0%へ初期化する。開始できる行動回数が残っていない場合は探索を開始しない。 各進行地点では「イベント解決→進行度上昇」の順。進行度だけ先に進めない。0%と100%もイベント処理対象。 進行上昇値はエリアデータのprogressStepを使用する。開拓拠点は25%。通常エリアは各エリア設定に従う。 固定イベントがない地点では、そのエリアのランダムイベント表から抽選する。同一探索内で既出の通常イベントは候補から除く。 通常エリアのイベント抽選・魔物遭遇には、その日の天気、現在の時間帯、有効な噂を反映する。異界には天気・時間帯を適用しない。 戦闘が発生したら戦闘を最後まで処理し、必要な採取・ドロップ処理を済ませてからその進行地点を解決済みにする。 隠しエリア入口イベントが成立した場合、侵入を選ぶと追加で1行動消費。隠し探索の状態は元探索とは分離し、終了後に元探索の状態へ復帰する。 途中帰還ではその探索セッションを終了する。次回探索は0%から開始する。 100%地点のイベント解決後、その探索を完了として終了する。"},{"key":"gm-1","scope":"gm","scopeLabel":"GM","title":"探索・イベント進行","tags":["GM","探索","イベント"],"html":"\u003cul>\u003cli>通常のエリアイベントで戦闘だけが発生し別判定がない場合、敵編成中の最大先制値を目標値とする感知判定で先制を決める。\u003c/li>\u003cli>クエストやイベント側に別の先制判定が指定されている場合は、その指定判定を使用する。\u003c/li>\u003cli>イベントの結果は原則その場で完結させ、不要な『次の判定』『次の戦闘』への持ち越し効果を増やさない。\u003c/li>\u003c/ul>","text":"通常のエリアイベントで戦闘だけが発生し別判定がない場合、敵編成中の最大先制値を目標値とする感知判定で先制を決める。 クエストやイベント側に別の先制判定が指定されている場合は、その指定判定を使用する。 イベントの結果は原則その場で完結させ、不要な『次の判定』『次の戦闘』への持ち越し効果を増やさない。"},{"key":"gm-2","scope":"gm","scopeLabel":"GM","title":"イベント判定コピー","tags":["GM","コピー"],"html":"\u003cul>\u003cli>判定コピー1行目は【イベント名】、2行目は判定内容。\u003c/li>\u003cli>素材入手は /素材入手、宝箱は /宝箱発見、直接被害等を避ける判定は /危機回避 を使用する。\u003c/li>\u003cli>戦闘が確定している場合は実際の魔物構成を『技能 / 達成値：X / 魔物A×1・魔物B×2』形式で記載する。二つ名は戦闘前に二つ名を伏せ、『通常種名？×1』と表示する。\u003c/li>\u003c/ul>","text":"判定コピー1行目は【イベント名】、2行目は判定内容。 素材入手は /素材入手、宝箱は /宝箱発見、直接被害等を避ける判定は /危機回避 を使用する。 戦闘が確定している場合は実際の魔物構成を『技能 / 達成値：X / 魔物A×1・魔物B×2』形式で記載する。二つ名は戦闘前に二つ名を伏せ、『通常種名？×1』と表示する。"},{"key":"gm-3","scope":"gm","scopeLabel":"GM","title":"魔物・ボス運用","tags":["GM","魔物","ボス"],"html":"\u003cul>\u003cli>通常魔物は遭遇時にHP・回避・抵抗・攻撃傾向の個体値を決定する。二つ名・ボスは固定値。\u003c/li>\u003cli>エリアボスはHP0相当まで追い込むと戦闘終了し、死亡・討伐・解体扱いにしない。勝利後は専用褒賞箱を授ける。\u003c/li>\u003cli>二つ名個体は通常種とは別の固定個体として扱う。通常種の汎用ドロップは維持するが、通常種のレア固有素材は引き継がず、二つ名専用素材へ置き換える。\u003c/li>\u003c/ul>","text":"通常魔物は遭遇時にHP・回避・抵抗・攻撃傾向の個体値を決定する。二つ名・ボスは固定値。 エリアボスはHP0相当まで追い込むと戦闘終了し、死亡・討伐・解体扱いにしない。勝利後は専用褒賞箱を授ける。 二つ名個体は通常種とは別の固定個体として扱う。通常種の汎用ドロップは維持するが、通常種のレア固有素材は引き継がず、二つ名専用素材へ置き換える。"},{"key":"gm-4","scope":"gm","scopeLabel":"GM","title":"増援・固有パッシブ","tags":["GM","増援","パッシブ"],"html":"\u003cul>\u003cli>増援を呼ぶ行動は状態異常ではなく、行動文に記載されたタイミングで処理する。\u003c/li>\u003cli>1戦闘1回の増援は使用済み管理を行い、増援側にも増援技が選出されている場合は追加の増援処理を用意する。\u003c/li>\u003cli>固有パッシブの自動・即時発動は通常行動を消費しない。パッシブ専用技は通常の所持技抽選へ含めない。\u003c/li>\u003c/ul>","text":"増援を呼ぶ行動は状態異常ではなく、行動文に記載されたタイミングで処理する。 1戦闘1回の増援は使用済み管理を行い、増援側にも増援技が選出されている場合は追加の増援処理を用意する。 固有パッシブの自動・即時発動は通常行動を消費しない。パッシブ専用技は通常の所持技抽選へ含めない。"},{"key":"gm-5","scope":"gm","scopeLabel":"GM","title":"ドロップ・採取・報酬","tags":["GM","報酬"],"html":"\u003cul>\u003cli>通常戦闘の戦闘後処理として採取・ドロップチェックを行う。\u003c/li>\u003cli>エリアボス固有素材は設定確率ごとに独立判定し、通常魔物用の採取・解体補正を適用しない。\u003c/li>\u003cli>逃走成功時は、その戦闘ですでに倒した敵を含め戦闘報酬をすべて失う。\u003c/li>\u003c/ul>","text":"通常戦闘の戦闘後処理として採取・ドロップチェックを行う。 エリアボス固有素材は設定確率ごとに独立判定し、通常魔物用の採取・解体補正を適用しない。 逃走成功時は、その戦闘ですでに倒した敵を含め戦闘報酬をすべて失う。"},{"key":"gm-6","scope":"gm","scopeLabel":"GM","title":"魔物出力","tags":["魔物","チャットパレット","出力"],"html":"\u003cul>\u003cli>魔物出力はJSONではなく、クリップボードコピー形式にする。\u003c/li>\u003cli>魔物出力にキャラクターメモは含めない。\u003c/li>\u003cli>魔物出力にドロップは含めない。\u003c/li>\u003cli>チャットパレットは「choice[技名1,技名2,…]」から始める。条件付きの技がある場合は平常時と全技のchoiceを分ける。\u003c/li>\u003cli>ラウンド開始時にプレイヤーへ公開するのは使用予定の行動名だけ。対象となるPC・対象列・距離・威力・効果は事前公開しない。対象PC・対象列は、その魔物の行動を実際に解決する時点で選ぶ。\u003c/li>\u003cli>GM用チャットパレットには行動種別、対象、距離（近距離／遠距離／自身）、ダメージ、効果を表示する。\u003c/li>\u003cli>魔物に固有行動AIが設定されている場合だけ、GM用チャットパレットへ「固有行動AI」とその標的・行動優先ルールを表示する。固有行動AIが空欄の魔物は従来どおり対象・行動を自由／ランダムに選び、チャットパレットにもAI欄を表示しない。\u003c/li>\u003cli>\u003cstrong>固有行動AIの固定化監査：\u003c/strong>「直前に選んだ対象を次も最優先」のように条件そのものが自己維持して永久固定されるAIは原則使わない。高防御・高回避など相性の悪い対象へ無意味に攻撃し続ける場合と、低防御対象へ確定集中して事故死させる場合の両方を確認する。継続狙いを持たせる場合は、実ダメージ発生など意味のある成功条件と、0ダメージ・失敗・対象不成立時に通常抽選へ戻る解除条件を持たせる。\u003c/li>\u003cli>固有行動AIは魔物の生態・既存行動と結び付け、対象候補が複数いる場合はランダム選択を残すなど、特定PCへの恒常的な集中攻撃にならないようにする。AIを追加・変更した場合は、先制順・後衛到達・状態異常・かばう・遭遇編成まで含め、狙われ方が理不尽な即死圧にならないか再監査する。\u003c/li>\u003cli>状態異常を付与する行動は、状態名だけでなく具体的な効果と継続期間も表示する。段階制の状態異常は、行動側の「1段階付与」「2段階付与」だけで済ませず、I・II・IIIなど現在定義されている全段階の効果説明をGM用チャットパレットへまとめて表示する。\u003c/li>\u003cli>ダイスのない効果も技能セクションに入れる。\u003c/li>\u003c/ul>","text":"魔物出力はJSONではなく、クリップボードコピー形式にする。 魔物出力にキャラクターメモは含めない。 魔物出力にドロップは含めない。 チャットパレットは「choice[技名1,技名2,…]」から始める。条件付きの技がある場合は平常時と全技のchoiceを分ける。 ラウンド開始時にプレイヤーへ公開するのは使用予定の行動名だけ。対象となるPC・対象列・距離・威力・効果は事前公開しない。対象PC・対象列は、その魔物の行動を実際に解決する時点で選ぶ。 GM用チャットパレットには行動種別、対象、距離（近距離／遠距離／自身）、ダメージ、効果を表示する。 魔物に固有行動AIが設定されている場合だけ、GM用チャットパレットへ「固有行動AI」とその標的・行動優先ルールを表示する。固有行動AIが空欄の魔物は従来どおり対象・行動を自由／ランダムに選び、チャットパレットにもAI欄を表示しない。 固有行動AIの固定化監査： 「直前に選んだ対象を次も最優先」のように条件そのものが自己維持して永久固定されるAIは原則使わない。高防御・高回避など相性の悪い対象へ無意味に攻撃し続ける場合と、低防御対象へ確定集中して事故死させる場合の両方を確認する。継続狙いを持たせる場合は、実ダメージ発生など意味のある成功条件と、0ダメージ・失敗・対象不成立時に通常抽選へ戻る解除条件を持たせる。 固有行動AIは魔物の生態・既存行動と結び付け、対象候補が複数いる場合はランダム選択を残すなど、特定PCへの恒常的な集中攻撃にならないようにする。AIを追加・変更した場合は、先制順・後衛到達・状態異常・かばう・遭遇編成まで含め、狙われ方が理不尽な即死圧にならないか再監査する。 状態異常を付与する行動は、状態名だけでなく具体的な効果と継続期間も表示する。段階制の状態異常は、行動側の「1段階付与」「2段階付与」だけで済ませず、I・II・IIIなど現在定義されている全段階の効果説明をGM用チャットパレットへまとめて表示する。 ダイスのない効果も技能セクションに入れる。"},{"key":"gm-7","scope":"gm","scopeLabel":"GM","title":"先制・ラウンド進行","tags":["GM","先制","ラウンド"],"html":"\u003cul>\u003cli>通常戦闘は敵編成中の最大先制値を目標値とする感知判定を基本とする。イベント側に別判定が指定されている場合はその判定を使用する。\u003c/li>\u003cli>成功時はPC側→敵側、失敗時は敵側→PC側。重要クエスト100%戦闘・エリアボス戦は敵側→PC側で固定する。戦闘開始時に決まった陣営順は戦闘終了まで維持する。\u003c/li>\u003cli>敵側は先制値の高い順、同値ならシステム内部で割り振られた小数点が小さい順に行動する。PC・サポート側の行動順は自由。\u003c/li>\u003cli>ラウンド開始時にPC・サポートの行動使用状態をリセットする。開始時の複数処理は自由順だが、敵の予定行動名の公開は開始時処理の最後。対象は行動解決時に決定する。\u003c/li>\u003c/ul>","text":"通常戦闘は敵編成中の最大先制値を目標値とする感知判定を基本とする。イベント側に別判定が指定されている場合はその判定を使用する。 成功時はPC側→敵側、失敗時は敵側→PC側。重要クエスト100%戦闘・エリアボス戦は敵側→PC側で固定する。戦闘開始時に決まった陣営順は戦闘終了まで維持する。 敵側は先制値の高い順、同値ならシステム内部で割り振られた小数点が小さい順に行動する。PC・サポート側の行動順は自由。 ラウンド開始時にPC・サポートの行動使用状態をリセットする。開始時の複数処理は自由順だが、敵の予定行動名の公開は開始時処理の最後。対象は行動解決時に決定する。"},{"key":"gm-8","scope":"gm","scopeLabel":"GM","title":"魔物行動の判定","tags":["GM","判定","魔物"],"html":"\u003cul>\u003cli>敵側の行動はPC側の術式・祈祷・妨害などへ分類せず、すべて行動ごとの「判定」として扱う。\u003c/li>\u003cli>魔物本体に共通命中値を持たせず、各行動に設定された基礎技能値で判定する。判定欄は基礎技能値>=回避値、基礎技能値>=抵抗値、基礎技能値>=固定達成値など参照先を示す。\u003c/li>\u003cli>PCは戦闘中に能動的な回避・抵抗判定を行わない。敵側の判定結果をPCの回避値・抵抗値へ比較する。\u003c/li>\u003cli>《妨害》を受けている対象は、次に関与する判定1回でその対象側の参照値-2。対象自身が判定する場合も、対象の回避値・抵抗値等が参照される場合も適用する。\u003c/li>\u003c/ul>","text":"敵側の行動はPC側の術式・祈祷・妨害などへ分類せず、すべて行動ごとの「判定」として扱う。 魔物本体に共通命中値を持たせず、各行動に設定された基礎技能値で判定する。判定欄は基礎技能値>=回避値、基礎技能値>=抵抗値、基礎技能値>=固定達成値など参照先を示す。 PCは戦闘中に能動的な回避・抵抗判定を行わない。敵側の判定結果をPCの回避値・抵抗値へ比較する。 《妨害》を受けている対象は、次に関与する判定1回でその対象側の参照値-2。対象自身が判定する場合も、対象の回避値・抵抗値等が参照される場合も適用する。"},{"key":"gm-9","scope":"gm","scopeLabel":"GM","title":"二つ名・隠しエリア","tags":["GM","二つ名","隠し"],"html":"\u003cul>\u003cli>二つ名個体は通常種とは別の固定個体で、通常種の個体値を使用しない。\u003c/li>\u003cli>通常エリアでは二つ名遭遇専用枠で処理し、戦闘開始前は二つ名を伏せて通常種名＋「？」で提示する。\u003c/li>\u003cli>隠しエリアで発生する戦闘は二つ名戦闘のみ。隠しエリア側の遭遇ルールに従って抽選する。\u003c/li>\u003cli>二つ名の属性相性は現行では通常種と同じ。解析等で通常種について既知の属性情報は二つ名にも引き継ぐ。\u003c/li>\u003c/ul>","text":"二つ名個体は通常種とは別の固定個体で、通常種の個体値を使用しない。 通常エリアでは二つ名遭遇専用枠で処理し、戦闘開始前は二つ名を伏せて通常種名＋「？」で提示する。 隠しエリアで発生する戦闘は二つ名戦闘のみ。隠しエリア側の遭遇ルールに従って抽選する。 二つ名の属性相性は現行では通常種と同じ。解析等で通常種について既知の属性情報は二つ名にも引き継ぐ。"},{"key":"gm-10","scope":"gm","scopeLabel":"GM","title":"失敗・撤退処理","tags":["GM","撤退","失敗"],"html":"\u003cul>\u003cli>通常探索の途中帰還は、その探索セッションだけを終了する。獲得済みの通常報酬は保持し、探索進行度を破棄する。所持金・獲得物への追加ペナルティは付けない。\u003c/li>\u003cli>未完了クエストから撤退した場合はその挑戦を終了し、進行度を0へ戻す。クエスト報酬は与えない。重要クエスト・デイリーとも、個別に再挑戦不可と書かれていない限り次回は0%から再挑戦できる。\u003c/li>\u003cli>イベント・特殊戦闘などで明記されたクエスト失敗条件を満たした場合は、その場で挑戦失敗として終了する。個別記載がなければ、失敗に追加の所持金・アイテム喪失は付けない。\u003c/li>\u003cli>全滅時は通常失敗処理に加え、全滅ルールの所持金25%・探索中新規獲得物50%喪失を処理し、クエスト中ならクエスト失敗とする。\u003c/li>\u003cli>サポートだけが残った自動帰還は全滅扱いにしない。クエスト中ならその挑戦は終了するが、全滅ペナルティは適用しない。\u003c/li>\u003cli>戦闘逃走成功時はその戦闘だけを終了し、戦闘報酬を全喪失する。探索・クエスト自体は、別途失敗条件に該当しない限り継続可能。\u003c/li>\u003c/ul>","text":"通常探索の途中帰還は、その探索セッションだけを終了する。獲得済みの通常報酬は保持し、探索進行度を破棄する。所持金・獲得物への追加ペナルティは付けない。 未完了クエストから撤退した場合はその挑戦を終了し、進行度を0へ戻す。クエスト報酬は与えない。重要クエスト・デイリーとも、個別に再挑戦不可と書かれていない限り次回は0%から再挑戦できる。 イベント・特殊戦闘などで明記されたクエスト失敗条件を満たした場合は、その場で挑戦失敗として終了する。個別記載がなければ、失敗に追加の所持金・アイテム喪失は付けない。 全滅時は通常失敗処理に加え、全滅ルールの所持金25%・探索中新規獲得物50%喪失を処理し、クエスト中ならクエスト失敗とする。 サポートだけが残った自動帰還は全滅扱いにしない。クエスト中ならその挑戦は終了するが、全滅ペナルティは適用しない。 戦闘逃走成功時はその戦闘だけを終了し、戦闘報酬を全喪失する。探索・クエスト自体は、別途失敗条件に該当しない限り継続可能。"},{"key":"gm-11","scope":"gm","scopeLabel":"GM","title":"戦闘不能・撤退処理","tags":["GM","戦闘不能","帰還"],"html":"\u003cul>\u003cli>PCがHP0になると即戦闘不能。敵の対象候補から外し、状態・バフ・デバフ・継続効果を解除する。\u003c/li>\u003cli>PC全員が戦闘不能なら全滅処理。サポートだけが残った場合は全滅ではなく自動帰還として扱い、全滅ペナルティを適用しない。\u003c/li>\u003cli>逃走成功時はその戦闘を即終了し、すでに倒した敵を含め戦闘報酬をすべて失う。エリアボス戦・逃走不可指定の固定クエスト戦闘では逃走不可。\u003c/li>\u003c/ul>","text":"PCがHP0になると即戦闘不能。敵の対象候補から外し、状態・バフ・デバフ・継続効果を解除する。 PC全員が戦闘不能なら全滅処理。サポートだけが残った場合は全滅ではなく自動帰還として扱い、全滅ペナルティを適用しない。 逃走成功時はその戦闘を即終了し、すでに倒した敵を含め戦闘報酬をすべて失う。エリアボス戦・逃走不可指定の固定クエスト戦闘では逃走不可。"},{"key":"app-0","scope":"app","scopeLabel":"アプリ","title":"プレイヤー向け施設カタログ","tags":["プレイヤーキー","解放キー蓄積","鍛冶屋","薬屋","食事処","骨董屋","管理HTML選出"],"html":"\u003cul>\u003cli>\u003cb>越境ランダムイベント：\u003c/b>通常のエリア／拠点ランダムイベントへ混在します。越境アイテムを使用できるイベントが発生した場合、進行HTMLには対象となる越境アイテム名・消費数と「越境アイテムを使用」ボタンを必ず表示します。使用結果は通常のイベント入手とは分離して処理・コピーします。通常の越境アイテムはなるべく同一セット内で完結し、《眠れる種核》だけは外の探索エリアごとのランダム変化表を持ち、新エリア追加時に使い道を増やせます。拠点では《眠れる種核》は変化しません。\u003c/li>\u003cli>プレイヤー向け施設HTMLは鍛冶屋・薬屋・食事処・骨董屋を扱う。レシピ販売の品揃えは管理HTMLで選出・コピーする。宿屋、ギルドは含めない。鍛冶屋の装備強化では、強化対象・素材・強化回数・使用済み枠・鍛冶道具・補助剤を選び、自作難易度と施設依頼の成功率・料金を確認できる。鍛冶屋では装飾品の新規作成と段階強化を通常の作成一覧から分離し、全装飾品をひとつの横スクロール派生図で閲覧する。★ランクごとに縦列を揃え、各装飾品を選ぶと詳細モーダルで必要素材・費用・難度を確認できる。食事処には食材持ち込み料理だけを表示し、今日のおすすめ3品は表示しない。\u003c/li>\u003cli>骨董屋では常設販売品と店売りレシピを表示する。未鑑定スクロールは販売内容がランダムのため、魔法・祈祷や中身を分けず、★ごとの価格だけを表示する。\u003c/li>\u003cli>施設HTMLの販売商品は管理HTMLの各施設販売欄と同じDB行を参照し、買値はbuyPrice、売値はsellPriceを使用する。販売商品・作成一覧などカテゴリを持つ一覧はカテゴリ選択モーダルから絞り込み、カテゴリ選択モーダルには必ず「全て」を用意する。カテゴリを選ぶと追加の確定操作を挟まず、そのカテゴリを直ちに表示する。 管理HTMLの選択モーダルは、ヘッダーに内部ID・name属性などのプログラム用識別子を出さず、画面上の項目名だけを表示する。\u003c/li>\u003cli>施設HTMLへプレイヤーキーを入力し、GMから受け取った解放キーを順次追加する。入力した解放キーはGitHub公開DB内のSHA-256ハッシュと施設HTML上で照合し、一致したエリアだけを端末へ即時追加する。解放済みエリアIDはプレイヤーキー単位でGASへクラウド同期する。通常エリア・異界とも自動の累積解放は行わない。通常の加工素材はレシピ不要。自作は対応道具と必要素材を用意し、加工判定に成功すれば費用0G。施設依頼は必要素材と加工依頼費が必要だが判定不要。魔導インク・祈祷紙は例外として個別レシピが必要で、薬屋の素材加工に表示する。両レシピは薬屋で常設販売し、草原の工房レシピ箱からも入手できる。完成品は骨董屋でも常設購入できる。キー照合は施設HTMLとGitHub公開DBだけで行い、GASは解放済みエリアIDの保存だけを担当する。施設一覧の表示は端末保存状態を使って先に完了させ、GASの読込・同期はバックグラウンドで行う。GASがタイムアウトしても施設一覧そのものは表示済みの状態を維持する。公開共通DBには平文キーを含めず、照合用SHA-256ハッシュだけを含める。GM全エリア解放キーを登録したプレイヤーキーは、現在の全エリアを表示し、公開DBへ後から追加されたエリアにも自動で追従する。\u003c/li>\u003cli>レシピ販売は、管理HTMLで選択した解放済みエリアに対応する、常設店売りではなくボス以外の宝箱から実際に入手できるレシピから毎日6種類を選出する。1枠は指定エリア、残り5枠は解放済みエリア全体から完全ランダムで選ぶ。料理・装備強化・装飾品強化・クリスタル強化・エリアボス褒賞箱限定レシピは対象外。選出後は管理HTMLから結果をコピーする。\u003c/li>\u003cli>ランクは性能・難易度の目安であり、解放条件には使わない。\u003c/li>\u003cli>通常の商品・作成・素材加工は必要エリアに達するまで非表示。加工素材の加工情報はレシピ表ではなく素材データ側で管理する。\u003c/li>\u003cli>武器派生は未解放でも派生枠を表示し、派生後の名称、必要素材、効果を「？？？」にする。\u003c/li>\u003cli>ポーションと上級ポーションの必要素材は従来どおり変更しない。\u003c/li>\u003cli>公開カタログは閲覧専用とし、コピー機能は付けない。\u003c/li>\u003c/ul>","text":"越境ランダムイベント： 通常のエリア／拠点ランダムイベントへ混在します。越境アイテムを使用できるイベントが発生した場合、進行HTMLには対象となる越境アイテム名・消費数と「越境アイテムを使用」ボタンを必ず表示します。使用結果は通常のイベント入手とは分離して処理・コピーします。通常の越境アイテムはなるべく同一セット内で完結し、《眠れる種核》だけは外の探索エリアごとのランダム変化表を持ち、新エリア追加時に使い道を増やせます。拠点では《眠れる種核》は変化しません。 プレイヤー向け施設HTMLは鍛冶屋・薬屋・食事処・骨董屋を扱う。レシピ販売の品揃えは管理HTMLで選出・コピーする。宿屋、ギルドは含めない。鍛冶屋の装備強化では、強化対象・素材・強化回数・使用済み枠・鍛冶道具・補助剤を選び、自作難易度と施設依頼の成功率・料金を確認できる。鍛冶屋では装飾品の新規作成と段階強化を通常の
